<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Orenda Orthodontic System</title>
<style>
  :root{
    --bg:#f4e6da;
    --panel:#fffaf5;
    --panel2:#f0e2d2;
    --border:#e3cead;
    --text:#2b2420;
    --muted:#8a7768;
    --accent:#b98a63;
    --accent2:#8c6444;
    --green:#2e9d6f;
    --red:#c94f3c;
    --yellow:#b9860f;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    font-family:'Segoe UI', Tahoma, Arial, sans-serif;
    background:
      radial-gradient(circle at 15% 0%, rgba(185,138,99,.10), transparent 45%),
      radial-gradient(circle at 90% 20%, rgba(140,100,68,.06), transparent 40%),
      linear-gradient(180deg,#f4e6da,#f7ecdf 60%,#f4e6da);
    background-attachment:fixed;
    color:var(--text);
    min-height:100vh;
  }
  .app{max-width:900px;margin:0 auto;padding:20px 16px 60px;}
  header{
    display:flex;align-items:center;justify-content:space-between;
    margin-bottom:20px;
  }
  header .brand{display:flex;align-items:center;gap:10px;}
  header .brand img{
    height:78px;width:auto;
    display:block;
    filter:drop-shadow(0 0 6px rgba(185,138,99,.35)) saturate(1.35) contrast(1.12);
    animation:logoGlow 4s ease-in-out infinite;
  }
  @keyframes logoGlow{
    0%,100%{filter:drop-shadow(0 0 4px rgba(185,138,99,.25)) saturate(1.35) contrast(1.12);}
    50%{filter:drop-shadow(0 0 12px rgba(185,138,99,.55)) saturate(1.35) contrast(1.12);}
  }
  header h1{font-size:18px;margin:0;font-weight:700;font-family:Georgia,'Times New Roman',serif;letter-spacing:.3px;}
  header .brand small{display:block;color:var(--accent2);font-weight:700;font-size:15px;letter-spacing:.6px;margin-top:4px;}
  .breadcrumb{
    display:flex;align-items:center;gap:8px;
    font-size:14px;color:var(--muted);margin-bottom:18px;flex-wrap:wrap;
  }
  .breadcrumb span.crumb{cursor:pointer;color:var(--accent2);}
  .breadcrumb span.crumb:hover{text-decoration:underline;}
  .breadcrumb span.sep{color:var(--muted);}
  .card{
    background:var(--panel);
    border:1px solid var(--border);
    border-radius:14px;
    padding:16px;
    margin-bottom:14px;
  }
  .row{display:flex;gap:10px;align-items:center;flex-wrap:wrap;}
  input[type=text], input[type=number], input[type=date], textarea, select{
    background:var(--panel2);
    border:1px solid var(--border);
    color:var(--text);
    padding:10px 12px;
    border-radius:10px;
    font-size:14px;
    outline:none;
    font-family:inherit;
  }
  input:focus, textarea:focus, select:focus{border-color:var(--accent);}
  textarea{width:100%;resize:vertical;min-height:70px;}
  button{
    background:var(--accent);
    color:#fff;
    border:none;
    padding:10px 16px;
    border-radius:10px;
    font-size:14px;
    cursor:pointer;
    font-weight:600;
  }
  button:hover{background:var(--accent2);}
  button.secondary{background:var(--panel2);border:1px solid var(--border);color:var(--text);}
  button.danger{background:transparent;color:var(--red);border:1px solid var(--red);}
  button.small{padding:6px 10px;font-size:12px;}
  .photo-subtabs{display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap;}
  .photo-subtab{padding:8px 14px;border-radius:8px;border:1px solid var(--border);background:var(--panel2);color:var(--text);cursor:pointer;font-size:13px;}
  .photo-subtab.active{background:var(--accent,#2563eb);color:#fff;border-color:transparent;}
  .photo-batch-zone{border:2px dashed var(--accent,#2563eb);border-radius:10px;padding:16px;text-align:center;cursor:pointer;font-size:12.5px;color:var(--muted,#94a3b8);margin-bottom:16px;transition:background .15s,border-color .15s;}
  .photo-batch-zone.drag-over{background:rgba(37,99,235,.08);border-color:var(--accent2,#8c6444);}
  .photo-category-block{margin-bottom:18px;}
  .photo-category-title{font-size:13px;color:var(--muted,#94a3b8);margin-bottom:8px;font-weight:600;}
  .photo-slots-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px;}
  .photo-slot{border:2px dashed var(--border);border-radius:10px;padding:8px;text-align:center;cursor:pointer;min-height:120px;display:flex;flex-direction:column;justify-content:center;align-items:center;transition:border-color .15s,background .15s;}
  .photo-slot.drag-over{border-color:var(--accent,#2563eb);background:rgba(37,99,235,.08);}
  .photo-slot-label{font-size:11.5px;color:var(--muted,#94a3b8);margin-bottom:6px;}
  .photo-slot-empty{font-size:11px;color:var(--muted,#94a3b8);line-height:1.5;}
  .photo-slot-thumb-wrap{position:relative;width:100%;}
  .photo-slot-thumb{width:100%;height:88px;object-fit:cover;border-radius:6px;cursor:zoom-in;}
  .photo-slot-del{position:absolute;top:-8px;left:-8px;background:#ef4444;color:#fff;border:none;border-radius:50%;width:22px;height:22px;cursor:pointer;font-size:14px;line-height:1;}
  .photo-slot-edit{position:absolute;top:-8px;right:-8px;background:var(--accent,#2563eb);color:#fff;border:none;border-radius:50%;width:22px;height:22px;cursor:pointer;font-size:11px;line-height:1;padding:0;}
  .photo-timeline{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:6px;}
  .photo-timeline-pt{padding:6px 12px;border-radius:20px;border:1px solid var(--border);background:var(--panel2);color:var(--text);cursor:pointer;font-size:12.5px;}
  .photo-timeline-pt.active{background:var(--accent,#2563eb);color:#fff;border-color:transparent;}
  .photo-compare-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;}
  .photo-compare-col{text-align:center;}
  .photo-compare-img{width:100%;border-radius:10px;cursor:zoom-in;}
  .clinic-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:12px;}
  .clinic-tile{
    background:var(--panel);
    border:1px solid var(--border);
    border-radius:14px;
    padding:20px 14px;
    text-align:center;
    cursor:pointer;
    transition:.15s;
  }
  .clinic-tile:hover{border-color:var(--accent2);transform:translateY(-2px);box-shadow:0 4px 14px rgba(192,138,92,.15);}
  .clinic-tile .name{font-weight:700;font-size:16px;margin-bottom:4px;}
  .clinic-tile .count{color:var(--muted);font-size:12px;}
  .patient-list{list-style:none;padding:0;margin:0;}
  .patient-item{
    display:flex;align-items:center;justify-content:space-between;
    padding:12px 14px;
    border-bottom:1px solid var(--border);
    cursor:pointer;
  }
  .patient-item:last-child{border-bottom:none;}
  .patient-item:hover{background:var(--panel2);}
  .patient-item .pname{font-weight:600;}
  .patient-item .pnum{color:var(--muted);font-size:12px;}
  .letter-heading{
    color:var(--accent2);
    font-weight:700;
    font-size:13px;
    padding:8px 4px 4px;
  }
  .empty-state{color:var(--muted);text-align:center;padding:30px 10px;font-size:14px;}
  .top-actions{display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap;}
  .tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:16px;}
  .tab{
    padding:8px 14px;border-radius:10px;background:var(--panel2);
    border:1px solid var(--border);cursor:pointer;font-size:13px;color:var(--muted);
  }
  .tab.active{background:var(--accent);color:#fff;border-color:var(--accent);}
  .section-title{font-size:15px;font-weight:700;margin:0 0 10px;color:var(--accent2);}
  .placeholder{
    color:var(--muted);font-size:13px;
    border:1px dashed var(--border);
    border-radius:10px;
    padding:18px;
    text-align:center;
  }
  .modal-bg{
    position:fixed;inset:0;background:rgba(0,0,0,.6);
    display:flex;align-items:center;justify-content:center;
    z-index:50;padding:16px;
  }
  .modal{
    background:var(--panel);border:1px solid var(--border);
    border-radius:14px;padding:20px;max-width:380px;width:100%;
  }
  .modal h3{margin:0 0 14px;font-size:16px;}
  .field{margin-bottom:10px;}
  .field label{display:block;font-size:12px;color:var(--muted);margin-bottom:5px;}
  .field input, .field select{width:100%;}
  .modal-actions{display:flex;gap:8px;justify-content:flex-end;margin-top:14px;}
  .toast{
    position:fixed;bottom:20px;left:50%;transform:translateX(-50%);
    background:var(--panel2);border:1px solid var(--border);
    padding:10px 18px;border-radius:10px;font-size:13px;
    opacity:0;transition:.3s;pointer-events:none;z-index:100;
  }
  .toast.show{opacity:1;transform:translateX(-50%) translateY(-6px);}
  .net-status{
    position:fixed;top:10px;left:50%;transform:translateX(-50%);
    display:none;align-items:center;gap:8px;
    background:#3a1414;border:1px solid #a33;color:#ffb3b3;
    padding:8px 16px;border-radius:10px;font-size:13px;font-weight:700;
    z-index:200;box-shadow:0 4px 14px rgba(0,0,0,.35);
  }
  .net-status.show{display:flex;}
  .net-status .dot{width:8px;height:8px;border-radius:50%;background:#e33;flex:none;animation:netDotBlink 1.2s infinite;}
  @keyframes netDotBlink{0%,100%{opacity:1;}50%{opacity:.25;}}
  .sync-status{top:54px;background:#3a2f14;border-color:#a87d33;color:#ffdf9e;}
  .sync-status .dot{background:#e3a33e;}
  .patient-header{
    display:flex;justify-content:space-between;align-items:flex-start;
    gap:10px;flex-wrap:wrap;margin-bottom:6px;
  }
  .patient-header .pbig{font-size:19px;font-weight:800;}
  .patient-header .psub{color:var(--muted);font-size:13px;margin-top:2px;}
  .loading{color:var(--muted);text-align:center;padding:40px;font-size:14px;}

  .diag-accordion{border:1px solid var(--border);border-radius:12px;margin-bottom:10px;overflow:hidden;background:var(--panel2);}
  .diag-acc-head{
    display:flex;align-items:center;justify-content:space-between;
    padding:12px 14px;cursor:pointer;user-select:none;
  }
  .diag-acc-head:hover{background:rgba(192,138,92,.06);}
  .diag-acc-head .t{font-weight:700;color:var(--accent2);font-size:14px;}
  .diag-acc-head .arrow{color:var(--muted);transition:.15s;font-size:12px;}
  .diag-acc-head.open .arrow{transform:rotate(90deg);}
  .diag-acc-body{padding:0 14px 14px;}
  table.diag-table{width:100%;border-collapse:collapse;font-size:13px;border:1px solid var(--border);}
  table.diag-table th{
    background:var(--panel);color:var(--accent2);font-size:11.5px;text-transform:uppercase;
    letter-spacing:.4px;padding:8px 6px;text-align:right;border:1px solid var(--border);
  }
  table.diag-table tr{border-bottom:1px solid var(--border);}
  table.diag-table tr:last-child{border-bottom:none;}
  table.diag-table td{padding:7px 6px;vertical-align:top;border:1px solid var(--border);}
  table.diag-table td.lbl{width:42%;color:var(--muted);font-size:12.5px;}
  table.diag-table td.val textarea{width:100%;min-height:34px;padding:6px 8px;font-size:13px;}
  table.diag-table td.val input[type=text]{width:100%;padding:8px;font-size:13px;}
  table.diag-table td.lbl input{width:100%;background:transparent;border:none;color:var(--muted);font-size:12.5px;padding:4px 2px;}
  table.diag-table td.lbl input:focus{background:var(--panel);border-radius:6px;}
  tr.diag-group-row td{background:rgba(192,138,92,.08);padding-top:6px;padding-bottom:6px;}
  tr.diag-group-row .gname{color:var(--accent);font-weight:700;font-size:12px;letter-spacing:.4px;text-transform:uppercase;}
  td.act{width:56px;padding-top:6px;}
  td.act button{padding:3px 7px;font-size:11px;}
  .act-buttons{display:flex;flex-direction:column;gap:4px;}
  .diag-flag{background:transparent;border:1px solid var(--red);color:var(--red);}
  .diag-flag:hover{background:rgba(224,106,90,.15);}
  .diag-side-by-side{display:flex;gap:10px;flex-wrap:wrap;}
  .diag-side-by-side > .diag-accordion{flex:1;min-width:280px;}

  .bracket-summary{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:14px;}
  .bracket-stat{background:var(--panel2);border:1px solid var(--border);border-radius:12px;padding:10px 16px;text-align:center;min-width:110px;}
  .bracket-stat .num{font-size:22px;font-weight:800;color:var(--accent2);}
  .bracket-stat .lbl{font-size:11px;color:var(--muted);margin-top:2px;}
  .bracket-alert{background:rgba(224,106,90,.12);border:1px solid var(--red);color:var(--red);border-radius:10px;padding:10px 14px;font-size:13px;margin-bottom:14px;}
  .stock-alert-blink{animation:stockBlink 1.4s ease-in-out infinite;}
  @keyframes stockBlink{
    0%,100%{background:rgba(224,106,90,.12);border-color:var(--red);}
    50%{background:rgba(224,106,90,.32);border-color:#e06a5a;}
  }
  .btn-stock-alert{animation:btnStockBlink 1.4s ease-in-out infinite;}
  @keyframes btnStockBlink{
    0%,100%{background:var(--panel2);border-color:var(--border);color:var(--text);}
    50%{background:rgba(224,106,90,.35);border-color:var(--red);color:var(--red);}
  }
  .low-stock-row{animation:lowRowBlink 1.4s ease-in-out infinite;}
  .photo-reminder{margin-top:8px;padding:6px 8px;border-radius:8px;background:#fff3e0;color:#b45309;font-size:12px;display:flex;align-items:center;justify-content:space-between;gap:8px;}
  .photo-reminder .photo-mark-btn{font-size:11px;padding:3px 8px;}

  /* ===== Patient contact / missed-follow-up badges ===== */
  .appt-badge{display:inline-flex;align-items:center;gap:4px;padding:3px 10px;border-radius:20px;font-size:11.5px;font-weight:700;white-space:nowrap;}
  .appt-badge.overdue{background:rgba(224,106,90,.16);color:var(--red);border:1px solid var(--red);}
  .appt-badge.none{background:var(--panel2);color:var(--muted);border:1px solid var(--border);}
  .pcontact{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-top:4px;}
  .pcontact .pmeta{color:var(--muted);font-size:12px;}
  .wa-btn{background:var(--green);color:#fff;text-decoration:none;padding:5px 10px;border-radius:10px;font-size:12px;font-weight:700;display:inline-flex;align-items:center;gap:4px;}
  .wa-btn:hover{background:#237e58;}
  .wa-btn.disabled{background:var(--panel2);color:var(--muted);pointer-events:none;border:1px solid var(--border);}
  .wa-btn.small{padding:3px 8px;font-size:11.5px;}
  @keyframes lowRowBlink{
    0%,100%{background:rgba(224,106,90,.08);}
    50%{background:rgba(224,106,90,.28);}
  }
  .tooth-arch{margin-bottom:16px;}
  .tooth-arch .arch-label{font-size:11px;color:var(--muted);margin-bottom:6px;letter-spacing:.5px;}
  .tooth-row{display:flex;gap:5px;flex-wrap:wrap;align-items:center;}
  .tooth-row .quad-gap{width:10px;}
  .tooth{
    position:relative;width:36px;height:44px;border-radius:8px 8px 12px 12px;
    background:var(--green);color:#04241a;display:flex;align-items:center;justify-content:center;
    font-size:11px;font-weight:800;cursor:pointer;border:2px solid transparent;transition:.15s;
  }
  .tooth:hover{transform:translateY(-2px);}
  .tooth.broken{background:var(--red);color:#2b0906;}
  .tooth.repeat{border-color:var(--yellow);box-shadow:0 0 0 2px rgba(230,185,58,.5);}
  .tooth.selected{background:var(--accent2);color:#fff;box-shadow:0 0 0 2px rgba(140,100,68,.5);}
  .tooth.low-refill{border-color:var(--red);box-shadow:0 0 0 2px rgba(224,106,90,.45);}
  .tooth.low-refill .badge{background:var(--red);}
  .tooth .badge{
    position:absolute;top:-6px;left:-6px;background:var(--yellow);color:#2b1c02;
    border-radius:50%;width:16px;height:16px;font-size:9px;display:flex;align-items:center;justify-content:center;font-weight:800;
  }
  .reveal-tooth .badge{
    min-width:16px;width:auto;padding:0 3px;border-radius:8px;
    background:var(--accent2);color:#fff;
  }
  .break-log{margin-top:18px;}
  .break-log table{width:100%;border-collapse:collapse;font-size:12.5px;}
  .break-log th{text-align:right;color:var(--accent2);font-size:11px;padding:6px;border-bottom:1px solid var(--border);}
  .break-log td{padding:6px;border-bottom:1px solid var(--border);}
  .break-log .charge-yes{color:var(--yellow);font-weight:700;}
  .break-log .charge-no{color:var(--muted);}

  .month-entry{background:var(--panel2);border:1px solid var(--border);border-radius:12px;padding:12px 14px;margin-bottom:10px;}
  .month-entry-head{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:8px;flex-wrap:wrap;}
  .month-entry-head input[type=date]{font-size:13px;}
  .month-entry .lbl{font-size:11px;color:var(--muted);margin:8px 0 4px;}
  .month-entry textarea{width:100%;min-height:56px;}
  .stage-tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:4px;}
  .stage-tag{display:flex;align-items:center;gap:5px;background:var(--panel);border:1px solid var(--border);border-radius:20px;padding:5px 10px;font-size:11.5px;cursor:pointer;color:var(--muted);}
  .stage-tag input{accent-color:var(--accent);}
  .stage-tag.checked{border-color:var(--accent);color:var(--text);background:rgba(192,138,92,.12);}

  .stage-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px;}
  .stage-card{background:var(--panel2);border:1px solid var(--border);border-radius:12px;padding:14px;}
  .stage-card.dragging{border-color:var(--red);}
  .stage-card-head{display:flex;justify-content:space-between;align-items:center;}
  .stage-name{font-weight:700;font-size:13.5px;}
  .stage-count{font-size:20px;font-weight:800;color:var(--accent2);}
  .stage-dates{display:flex;flex-wrap:wrap;gap:5px;margin-top:8px;}
  .stage-date-chip{display:flex;align-items:center;gap:2px;background:var(--panel);border:1px solid var(--border);border-radius:8px;padding:2px 2px 2px 6px;}
  .stage-date-chip input[type=date]{background:transparent;border:none;color:var(--muted);font-size:11px;padding:2px;width:106px;}
  .stage-date-chip button{background:transparent;border:none;color:var(--red);cursor:pointer;font-size:13px;padding:2px 6px;font-weight:800;}

  .hygiene-select-row select{width:100%;}
  .hygiene-row{display:flex;justify-content:space-between;align-items:center;padding:10px 12px;background:var(--panel2);border:1px solid var(--border);border-radius:10px;margin-bottom:8px;}
  .hygiene-date{font-size:12.5px;color:var(--muted);}
  .hygiene-chip{padding:4px 12px;border-radius:20px;font-size:12px;font-weight:700;}
  .hyg-excellent{background:rgba(62,207,142,.15);color:var(--green);}
  .hyg-good{background:rgba(192,138,92,.15);color:var(--accent2);}
  .hyg-fair{background:rgba(230,185,58,.15);color:var(--yellow);}
  .hyg-poor{background:rgba(224,106,90,.15);color:var(--red);}

  .finance-tables table{width:100%;border-collapse:collapse;font-size:12.5px;}
  .finance-tables th{text-align:right;color:var(--accent2);font-size:11px;padding:6px;border-bottom:1px solid var(--border);}
  .finance-tables td{padding:6px;border-bottom:1px solid var(--border);}
  .overview-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px;}
  .overview-card{border:1px solid var(--border);border-radius:12px;padding:14px;background:var(--panel2);}
  .overview-card-title{font-size:12.5px;font-weight:700;color:var(--accent2);margin-bottom:10px;text-transform:uppercase;letter-spacing:.4px;}
  .overview-row{display:flex;justify-content:space-between;gap:10px;padding:5px 0;border-bottom:1px solid var(--border);font-size:13px;}
  .overview-row:last-child{border-bottom:none;}
  .overview-row .ov-lbl{color:var(--muted);flex-shrink:0;}
  .overview-row .ov-val{text-align:left;font-weight:600;}
  .overview-row .ov-val.ov-alert{color:var(--red);}
</style>
</head>
<body>
<div class="app" id="app">
  <div class="loading">جارِ التحميل...</div>
</div>
<div id="netStatus" class="net-status"><span class="dot"></span><span>مفيش اتصال بالنت — أي حفظ هيفشل لحد ما النت يرجع</span></div>
<div id="syncStatus" class="net-status sync-status"><span class="dot"></span><span id="syncStatusText"></span></div>
<div id="toast" class="toast"></div>

<script src="js/storage.js"></script>
<script src="js/auth.js"></script>
<script src="js/backup.js"></script>
<script src="js/modals.js"></script>
<script src="js/state.js"></script>
<script src="js/clinic-features.js"></script>
<script src="js/data-loading.js"></script>
<script src="js/render-core.js"></script>
<script src="js/clinics-view.js"></script>
<script src="js/patients-view.js"></script>
<script src="js/inventory-view.js"></script>
<script src="js/patient-shell.js"></script>
