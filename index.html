<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Orenda Orthodontic System</title>
<style>
  :root{
    --bg:#f4e6da;
    --panel:#fffaf5;
    --panel2:#f0e2d2;
    --border:#e3cead;
    --text:#2b2420;
    --muted:#8a7768;
    --accent:#b98a63;
    --accent2:#8c6444;
    --green:#2e9d6f;
    --red:#c94f3c;
    --yellow:#b9860f;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    font-family:'Segoe UI', Tahoma, Arial, sans-serif;
    background:
      radial-gradient(circle at 15% 0%, rgba(185,138,99,.10), transparent 45%),
      radial-gradient(circle at 90% 20%, rgba(140,100,68,.06), transparent 40%),
      linear-gradient(180deg,#f4e6da,#f7ecdf 60%,#f4e6da);
    background-attachment:fixed;
    color:var(--text);
    min-height:100vh;
  }
  .app{max-width:900px;margin:0 auto;padding:20px 16px 60px;}
  header{
    display:flex;align-items:center;justify-content:space-between;
    margin-bottom:20px;
  }
  header .brand{display:flex;align-items:center;gap:10px;}
  header .brand img{
    height:78px;width:auto;
    display:block;
    filter:drop-shadow(0 0 6px rgba(185,138,99,.35)) saturate(1.35) contrast(1.12);
    animation:logoGlow 4s ease-in-out infinite;
  }
  @keyframes logoGlow{
    0%,100%{filter:drop-shadow(0 0 4px rgba(185,138,99,.25)) saturate(1.35) contrast(1.12);}
    50%{filter:drop-shadow(0 0 12px rgba(185,138,99,.55)) saturate(1.35) contrast(1.12);}
  }
  header h1{font-size:18px;margin:0;font-weight:700;font-family:Georgia,'Times New Roman',serif;letter-spacing:.3px;}
  header .brand small{display:block;color:var(--accent2);font-weight:700;font-size:15px;letter-spacing:.6px;margin-top:4px;}
  .breadcrumb{
    display:flex;align-items:center;gap:8px;
    font-size:14px;color:var(--muted);margin-bottom:18px;flex-wrap:wrap;
  }
  .breadcrumb span.crumb{cursor:pointer;color:var(--accent2);}
  .breadcrumb span.crumb:hover{text-decoration:underline;}
  .breadcrumb span.sep{color:var(--muted);}
  .card{
    background:var(--panel);
    border:1px solid var(--border);
    border-radius:14px;
    padding:16px;
    margin-bottom:14px;
  }
  .row{display:flex;gap:10px;align-items:center;flex-wrap:wrap;}
  input[type=text], input[type=number], input[type=date], textarea, select{
    background:var(--panel2);
    border:1px solid var(--border);
    color:var(--text);
    padding:10px 12px;
    border-radius:10px;
    font-size:14px;
    outline:none;
    font-family:inherit;
  }
  input:focus, textarea:focus, select:focus{border-color:var(--accent);}
  textarea{width:100%;resize:vertical;min-height:70px;}
  button{
    background:var(--accent);
    color:#fff;
    border:none;
    padding:10px 16px;
    border-radius:10px;
    font-size:14px;
    cursor:pointer;
    font-weight:600;
  }
  button:hover{background:var(--accent2);}
  button.secondary{background:var(--panel2);border:1px solid var(--border);color:var(--text);}
  button.danger{background:transparent;color:var(--red);border:1px solid var(--red);}
  button.small{padding:6px 10px;font-size:12px;}
  .photo-subtabs{display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap;}
  .photo-subtab{padding:8px 14px;border-radius:8px;border:1px solid var(--border);background:var(--panel2);color:var(--text);cursor:pointer;font-size:13px;}
  .photo-subtab.active{background:var(--accent,#2563eb);color:#fff;border-color:transparent;}
  .photo-batch-zone{border:2px dashed var(--accent,#2563eb);border-radius:10px;padding:16px;text-align:center;cursor:pointer;font-size:12.5px;color:var(--muted,#94a3b8);margin-bottom:16px;transition:background .15s,border-color .15s;}
  .photo-batch-zone.drag-over{background:rgba(37,99,235,.08);border-color:var(--accent2,#8c6444);}
  .photo-category-block{margin-bottom:18px;}
  .photo-category-title{font-size:13px;color:var(--muted,#94a3b8);margin-bottom:8px;font-weight:600;}
  .photo-slots-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px;}
  .photo-slot{border:2px dashed var(--border);border-radius:10px;padding:8px;text-align:center;cursor:pointer;min-height:120px;display:flex;flex-direction:column;justify-content:center;align-items:center;transition:border-color .15s,background .15s;}
  .photo-slot.drag-over{border-color:var(--accent,#2563eb);background:rgba(37,99,235,.08);}
  .photo-slot-label{font-size:11.5px;color:var(--muted,#94a3b8);margin-bottom:6px;}
  .photo-slot-empty{font-size:11px;color:var(--muted,#94a3b8);line-height:1.5;}
  .photo-slot-thumb-wrap{position:relative;width:100%;}
  .photo-slot-thumb{width:100%;height:88px;object-fit:cover;border-radius:6px;cursor:zoom-in;}
  .photo-slot-del{position:absolute;top:-8px;left:-8px;background:#ef4444;color:#fff;border:none;border-radius:50%;width:22px;height:22px;cursor:pointer;font-size:14px;line-height:1;}
  .photo-timeline{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:6px;}
  .photo-timeline-pt{padding:6px 12px;border-radius:20px;border:1px solid var(--border);background:var(--panel2);color:var(--text);cursor:pointer;font-size:12.5px;}
  .photo-timeline-pt.active{background:var(--accent,#2563eb);color:#fff;border-color:transparent;}
  .photo-compare-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;}
  .photo-compare-col{text-align:center;}
  .photo-compare-img{width:100%;border-radius:10px;cursor:zoom-in;}
  .clinic-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:12px;}
  .clinic-tile{
    background:var(--panel);
    border:1px solid var(--border);
    border-radius:14px;
    padding:20px 14px;
    text-align:center;
    cursor:pointer;
    transition:.15s;
  }
  .clinic-tile:hover{border-color:var(--accent2);transform:translateY(-2px);box-shadow:0 4px 14px rgba(192,138,92,.15);}
  .clinic-tile .name{font-weight:700;font-size:16px;margin-bottom:4px;}
  .clinic-tile .count{color:var(--muted);font-size:12px;}
  .patient-list{list-style:none;padding:0;margin:0;}
  .patient-item{
    display:flex;align-items:center;justify-content:space-between;
    padding:12px 14px;
    border-bottom:1px solid var(--border);
    cursor:pointer;
  }
  .patient-item:last-child{border-bottom:none;}
  .patient-item:hover{background:var(--panel2);}
  .patient-item .pname{font-weight:600;}
  .patient-item .pnum{color:var(--muted);font-size:12px;}
  .letter-heading{
    color:var(--accent2);
    font-weight:700;
    font-size:13px;
    padding:8px 4px 4px;
  }
  .empty-state{color:var(--muted);text-align:center;padding:30px 10px;font-size:14px;}
  .top-actions{display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap;}
  .tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:16px;}
  .tab{
    padding:8px 14px;border-radius:10px;background:var(--panel2);
    border:1px solid var(--border);cursor:pointer;font-size:13px;color:var(--muted);
  }
  .tab.active{background:var(--accent);color:#fff;border-color:var(--accent);}
  .section-title{font-size:15px;font-weight:700;margin:0 0 10px;color:var(--accent2);}
  .placeholder{
    color:var(--muted);font-size:13px;
    border:1px dashed var(--border);
    border-radius:10px;
    padding:18px;
    text-align:center;
  }
  .modal-bg{
    position:fixed;inset:0;background:rgba(0,0,0,.6);
    display:flex;align-items:center;justify-content:center;
    z-index:50;padding:16px;
  }
  .modal{
    background:var(--panel);border:1px solid var(--border);
    border-radius:14px;padding:20px;max-width:380px;width:100%;
  }
  .modal h3{margin:0 0 14px;font-size:16px;}
  .field{margin-bottom:10px;}
  .field label{display:block;font-size:12px;color:var(--muted);margin-bottom:5px;}
  .field input, .field select{width:100%;}
  .modal-actions{display:flex;gap:8px;justify-content:flex-end;margin-top:14px;}
  .toast{
    position:fixed;bottom:20px;left:50%;transform:translateX(-50%);
    background:var(--panel2);border:1px solid var(--border);
    padding:10px 18px;border-radius:10px;font-size:13px;
    opacity:0;transition:.3s;pointer-events:none;z-index:100;
  }
  .toast.show{opacity:1;transform:translateX(-50%) translateY(-6px);}
  .patient-header{
    display:flex;justify-content:space-between;align-items:flex-start;
    gap:10px;flex-wrap:wrap;margin-bottom:6px;
  }
  .patient-header .pbig{font-size:19px;font-weight:800;}
  .patient-header .psub{color:var(--muted);font-size:13px;margin-top:2px;}
  .loading{color:var(--muted);text-align:center;padding:40px;font-size:14px;}

  .diag-accordion{border:1px solid var(--border);border-radius:12px;margin-bottom:10px;overflow:hidden;background:var(--panel2);}
  .diag-acc-head{
    display:flex;align-items:center;justify-content:space-between;
    padding:12px 14px;cursor:pointer;user-select:none;
  }
  .diag-acc-head:hover{background:rgba(192,138,92,.06);}
  .diag-acc-head .t{font-weight:700;color:var(--accent2);font-size:14px;}
  .diag-acc-head .arrow{color:var(--muted);transition:.15s;font-size:12px;}
  .diag-acc-head.open .arrow{transform:rotate(90deg);}
  .diag-acc-body{padding:0 14px 14px;}
  table.diag-table{width:100%;border-collapse:collapse;font-size:13px;border:1px solid var(--border);}
  table.diag-table th{
    background:var(--panel);color:var(--accent2);font-size:11.5px;text-transform:uppercase;
    letter-spacing:.4px;padding:8px 6px;text-align:right;border:1px solid var(--border);
  }
  table.diag-table tr{border-bottom:1px solid var(--border);}
  table.diag-table tr:last-child{border-bottom:none;}
  table.diag-table td{padding:7px 6px;vertical-align:top;border:1px solid var(--border);}
  table.diag-table td.lbl{width:42%;color:var(--muted);font-size:12.5px;}
  table.diag-table td.val textarea{width:100%;min-height:34px;padding:6px 8px;font-size:13px;}
  table.diag-table td.val input[type=text]{width:100%;padding:8px;font-size:13px;}
  table.diag-table td.lbl input{width:100%;background:transparent;border:none;color:var(--muted);font-size:12.5px;padding:4px 2px;}
  table.diag-table td.lbl input:focus{background:var(--panel);border-radius:6px;}
  tr.diag-group-row td{background:rgba(192,138,92,.08);padding-top:6px;padding-bottom:6px;}
  tr.diag-group-row .gname{color:var(--accent);font-weight:700;font-size:12px;letter-spacing:.4px;text-transform:uppercase;}
  td.act{width:56px;padding-top:6px;}
  td.act button{padding:3px 7px;font-size:11px;}
  .act-buttons{display:flex;flex-direction:column;gap:4px;}
  .diag-flag{background:transparent;border:1px solid var(--red);color:var(--red);}
  .diag-flag:hover{background:rgba(224,106,90,.15);}
  .diag-side-by-side{display:flex;gap:10px;flex-wrap:wrap;}
  .diag-side-by-side > .diag-accordion{flex:1;min-width:280px;}

  .bracket-summary{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:14px;}
  .bracket-stat{background:var(--panel2);border:1px solid var(--border);border-radius:12px;padding:10px 16px;text-align:center;min-width:110px;}
  .bracket-stat .num{font-size:22px;font-weight:800;color:var(--accent2);}
  .bracket-stat .lbl{font-size:11px;color:var(--muted);margin-top:2px;}
  .bracket-alert{background:rgba(224,106,90,.12);border:1px solid var(--red);color:var(--red);border-radius:10px;padding:10px 14px;font-size:13px;margin-bottom:14px;}
  .stock-alert-blink{animation:stockBlink 1.4s ease-in-out infinite;}
  @keyframes stockBlink{
    0%,100%{background:rgba(224,106,90,.12);border-color:var(--red);}
    50%{background:rgba(224,106,90,.32);border-color:#e06a5a;}
  }
  .btn-stock-alert{animation:btnStockBlink 1.4s ease-in-out infinite;}
  @keyframes btnStockBlink{
    0%,100%{background:var(--panel2);border-color:var(--border);color:var(--text);}
    50%{background:rgba(224,106,90,.35);border-color:var(--red);color:var(--red);}
  }
  .low-stock-row{animation:lowRowBlink 1.4s ease-in-out infinite;}
  .photo-reminder{margin-top:8px;padding:6px 8px;border-radius:8px;background:#fff3e0;color:#b45309;font-size:12px;display:flex;align-items:center;justify-content:space-between;gap:8px;}
  .photo-reminder .photo-mark-btn{font-size:11px;padding:3px 8px;}

  /* ===== Patient contact / missed-follow-up badges ===== */
  .appt-badge{display:inline-flex;align-items:center;gap:4px;padding:3px 10px;border-radius:20px;font-size:11.5px;font-weight:700;white-space:nowrap;}
  .appt-badge.overdue{background:rgba(224,106,90,.16);color:var(--red);border:1px solid var(--red);}
  .appt-badge.none{background:var(--panel2);color:var(--muted);border:1px solid var(--border);}
  .pcontact{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-top:4px;}
  .pcontact .pmeta{color:var(--muted);font-size:12px;}
  .wa-btn{background:var(--green);color:#fff;text-decoration:none;padding:5px 10px;border-radius:10px;font-size:12px;font-weight:700;display:inline-flex;align-items:center;gap:4px;}
  .wa-btn:hover{background:#237e58;}
  .wa-btn.disabled{background:var(--panel2);color:var(--muted);pointer-events:none;border:1px solid var(--border);}
  .wa-btn.small{padding:3px 8px;font-size:11.5px;}
  @keyframes lowRowBlink{
    0%,100%{background:rgba(224,106,90,.08);}
    50%{background:rgba(224,106,90,.28);}
  }
  .tooth-arch{margin-bottom:16px;}
  .tooth-arch .arch-label{font-size:11px;color:var(--muted);margin-bottom:6px;letter-spacing:.5px;}
  .tooth-row{display:flex;gap:5px;flex-wrap:wrap;align-items:center;}
  .tooth-row .quad-gap{width:10px;}
  .tooth{
    position:relative;width:36px;height:44px;border-radius:8px 8px 12px 12px;
    background:var(--green);color:#04241a;display:flex;align-items:center;justify-content:center;
    font-size:11px;font-weight:800;cursor:pointer;border:2px solid transparent;transition:.15s;
  }
  .tooth:hover{transform:translateY(-2px);}
  .tooth.broken{background:var(--red);color:#2b0906;}
  .tooth.repeat{border-color:var(--yellow);box-shadow:0 0 0 2px rgba(230,185,58,.5);}
  .tooth.low-refill{border-color:var(--red);box-shadow:0 0 0 2px rgba(224,106,90,.45);}
  .tooth.low-refill .badge{background:var(--red);}
  .tooth .badge{
    position:absolute;top:-6px;left:-6px;background:var(--yellow);color:#2b1c02;
    border-radius:50%;width:16px;height:16px;font-size:9px;display:flex;align-items:center;justify-content:center;font-weight:800;
  }
  .reveal-tooth .badge{
    min-width:16px;width:auto;padding:0 3px;border-radius:8px;
    background:var(--accent2);color:#fff;
  }
  .break-log{margin-top:18px;}
  .break-log table{width:100%;border-collapse:collapse;font-size:12.5px;}
  .break-log th{text-align:right;color:var(--accent2);font-size:11px;padding:6px;border-bottom:1px solid var(--border);}
  .break-log td{padding:6px;border-bottom:1px solid var(--border);}
  .break-log .charge-yes{color:var(--yellow);font-weight:700;}
  .break-log .charge-no{color:var(--muted);}

  .month-entry{background:var(--panel2);border:1px solid var(--border);border-radius:12px;padding:12px 14px;margin-bottom:10px;}
  .month-entry-head{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:8px;flex-wrap:wrap;}
  .month-entry-head input[type=date]{font-size:13px;}
  .month-entry .lbl{font-size:11px;color:var(--muted);margin:8px 0 4px;}
  .month-entry textarea{width:100%;min-height:56px;}
  .stage-tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:4px;}
  .stage-tag{display:flex;align-items:center;gap:5px;background:var(--panel);border:1px solid var(--border);border-radius:20px;padding:5px 10px;font-size:11.5px;cursor:pointer;color:var(--muted);}
  .stage-tag input{accent-color:var(--accent);}
  .stage-tag.checked{border-color:var(--accent);color:var(--text);background:rgba(192,138,92,.12);}

  .stage-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px;}
  .stage-card{background:var(--panel2);border:1px solid var(--border);border-radius:12px;padding:14px;}
  .stage-card.dragging{border-color:var(--red);}
  .stage-card-head{display:flex;justify-content:space-between;align-items:center;}
  .stage-name{font-weight:700;font-size:13.5px;}
  .stage-count{font-size:20px;font-weight:800;color:var(--accent2);}
  .stage-dates{display:flex;flex-wrap:wrap;gap:5px;margin-top:8px;}
  .stage-date-chip{display:flex;align-items:center;gap:2px;background:var(--panel);border:1px solid var(--border);border-radius:8px;padding:2px 2px 2px 6px;}
  .stage-date-chip input[type=date]{background:transparent;border:none;color:var(--muted);font-size:11px;padding:2px;width:106px;}
  .stage-date-chip button{background:transparent;border:none;color:var(--red);cursor:pointer;font-size:13px;padding:2px 6px;font-weight:800;}

  .hygiene-select-row select{width:100%;}
  .hygiene-row{display:flex;justify-content:space-between;align-items:center;padding:10px 12px;background:var(--panel2);border:1px solid var(--border);border-radius:10px;margin-bottom:8px;}
  .hygiene-date{font-size:12.5px;color:var(--muted);}
  .hygiene-chip{padding:4px 12px;border-radius:20px;font-size:12px;font-weight:700;}
  .hyg-excellent{background:rgba(62,207,142,.15);color:var(--green);}
  .hyg-good{background:rgba(192,138,92,.15);color:var(--accent2);}
  .hyg-fair{background:rgba(230,185,58,.15);color:var(--yellow);}
  .hyg-poor{background:rgba(224,106,90,.15);color:var(--red);}

  .finance-tables table{width:100%;border-collapse:collapse;font-size:12.5px;}
  .finance-tables th{text-align:right;color:var(--accent2);font-size:11px;padding:6px;border-bottom:1px solid var(--border);}
  .finance-tables td{padding:6px;border-bottom:1px solid var(--border);}
  .overview-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px;}
  .overview-card{border:1px solid var(--border);border-radius:12px;padding:14px;background:var(--panel2);}
  .overview-card-title{font-size:12.5px;font-weight:700;color:var(--accent2);margin-bottom:10px;text-transform:uppercase;letter-spacing:.4px;}
  .overview-row{display:flex;justify-content:space-between;gap:10px;padding:5px 0;border-bottom:1px solid var(--border);font-size:13px;}
  .overview-row:last-child{border-bottom:none;}
  .overview-row .ov-lbl{color:var(--muted);flex-shrink:0;}
  .overview-row .ov-val{text-align:left;font-weight:600;}
  .overview-row .ov-val.ov-alert{color:var(--red);}
</style>
</head>
<body>
<div class="app" id="app">
  <div class="loading">جارِ التحميل...</div>
</div>
<div id="toast" class="toast"></div>

<script>
// ============ STORAGE HELPERS (Supabase — synced live across every device) ============
const SUPABASE_URL = 'https://qlojglhddhnslvloqtzz.supabase.co';
const SUPABASE_KEY = 'sb_publishable_cORmYg4chO3LBoukS9Nfiw_9KvNcAy8';
const SUPABASE_REST = SUPABASE_URL + '/rest/v1/kv_store';
const SUPABASE_REST_LOG = SUPABASE_URL + '/rest/v1/activity_log';

function patientNameForLog(){
  const p = state.patients.find(x=>x.id === state.currentPatientId);
  return p ? p.name : (state.currentPatientId || 'مريض غير معروف');
}

// records a "who did what" entry — best-effort, never blocks or breaks the calling action if it fails
async function logActivity(action, description){  try{
    await ensureFreshSession();
    await fetch(SUPABASE_REST_LOG, {
      method: 'POST',
      headers: supabaseHeaders(),
      body: JSON.stringify([{
        actor_email: (authSession && authSession.email) || null,
        action,
        description,
        clinic_id: state.currentClinicId || null,
        patient_id: state.currentPatientId || null
      }])
    });
  }catch(e){
    console.error('logActivity failed', e);
  }
}

async function openActivityLogModal(){
  const bg = document.createElement('div');
  bg.className = 'modal-bg';
  bg.innerHTML = `
    <div class="modal" style="max-width:640px;">
      <h3>سجل العمليات</h3>
      <div id="activityLogBody" class="placeholder" style="padding:16px;">جارِ التحميل...</div>
      <div class="modal-actions">
        <button class="secondary" id="closeActivityLogBtn">إغلاق</button>
      </div>
    </div>
  `;
  document.body.appendChild(bg);
  document.getElementById('closeActivityLogBtn').onclick = () => bg.remove();
  bg.onclick = (e) => { if(e.target === bg) bg.remove(); };
  try{
    await ensureFreshSession();
    const res = await fetch(SUPABASE_REST_LOG + '?select=*&order=created_at.desc&limit=100', { headers: supabaseHeaders() });
    if(!res.ok) throw new Error('log fetch failed: ' + res.status);
    const rows = await res.json();

function supabaseHeaders(extra){

    'apikey': SUPABASE_KEY,
    'Authorization': 'Bearer ' + (authSession && authSession.access_token ? authSession.access_token : SUPABASE_KEY),
    'Content-Type': 'application/json'

// ============ AUTH (Supabase login — required so the data/photos aren't reachable by anyone who just gets the .html file) ============
let authSession = null; // {access_token, refresh_token, expires_at, email}

function loadStoredSession(){
  try{
    const raw = localStorage.getItem('orenda_auth_session');
    return raw ? JSON.parse(raw) : null;
  }catch(e){ return null; }
}
function storeSession(session){
  authSession = session;
  try{
    if(session) localStorage.setItem('orenda_auth_session', JSON.stringify(session));
    else localStorage.removeItem('orenda_auth_session');
  }catch(e){ console.error('could not persist session', e); }
}

async function supabaseLogin(email, password){
  const res = await fetch(`${SUPABASE_URL}/auth/v1/token?grant_type=password`, {
    method: 'POST',
    headers: { 'apikey': SUPABASE_KEY, 'Content-Type': 'application/json' },
    body: JSON.stringify({ email, password })
  });
  const data = await res.json();
  if(!res.ok) throw new Error(data.error_description || data.msg || 'الإيميل أو الباسورد غلط');
  storeSession({
    access_token: data.access_token,
    refresh_token: data.refresh_token,
    expires_at: Date.now() + (data.expires_in*1000),
    email
  });
}

async function supabaseRefreshSession(){
  if(!authSession || !authSession.refresh_token) return false;
  try{
    const res = await fetch(`${SUPABASE_URL}/auth/v1/token?grant_type=refresh_token`, {
      method: 'POST',
      headers: { 'apikey': SUPABASE_KEY, 'Content-Type': 'application/json' },
      body: JSON.stringify({ refresh_token: authSession.refresh_token })
    });
    const data = await res.json();
    if(!res.ok) return false;
    storeSession({
      access_token: data.access_token,
      refresh_token: data.refresh_token,
      expires_at: Date.now() + (data.expires_in*1000),
      email: authSession.email
    });
    return true;
  }catch(e){
    console.error('session refresh failed', e);
    return false;
  }
}

// call before any Supabase request — refreshes the login token if it's about to expire
async function ensureFreshSession(){
  if(!authSession) return false;
  if(Date.now() > authSession.expires_at - 60000){
    return await supabaseRefreshSession();
  }
  return true;
}

function supabaseLogout(){
  storeSession(null);
  location.reload();
}

// same signatures as the old IndexedDB helpers on purpose, so getData/setData below
// (and everything that calls them) didn't need to change at all.
async function idbGet(key){
  await ensureFreshSession();
  const res = await fetch(SUPABASE_REST + '?key=eq.' + encodeURIComponent(key) + '&select=value', {
    headers: supabaseHeaders()
  });
  if(!res.ok) throw new Error('Supabase get failed: ' + res.status);
  const rows = await res.json();
  if(!rows.length) return null;
  return JSON.stringify(rows[0].value); // getData() below expects a JSON string, same as before
}

async function idbSet(key, value){
  await ensureFreshSession();
  // value arrives already JSON.stringify()'d by setData(); kv_store.value is jsonb so we parse it back
  const res = await fetch(SUPABASE_REST, {
    method: 'POST',
    headers: supabaseHeaders({ 'Prefer': 'resolution=merge-duplicates' }),
    body: JSON.stringify([{ key, value: JSON.parse(value), updated_at: new Date().toISOString() }])
  });
  if(!res.ok) throw new Error('Supabase set failed: ' + res.status);
  return true;
}

async function idbListKeys(){
  await ensureFreshSession();
  const res = await fetch(SUPABASE_REST + '?select=key', { headers: supabaseHeaders() });
  if(!res.ok) throw new Error('Supabase list failed: ' + res.status);
  const rows = await res.json();
  return rows.map(r => r.key);
}

async function getData(key, fallback){
  try{
    const v = await idbGet(key);
    return (v !== null && v !== undefined) ? JSON.parse(v) : fallback;
  }catch(e){
    console.error('storage get failed', key, e);
    return fallback;
  }
}
async function setData(key, value){
  try{
    await idbSet(key, JSON.stringify(value));
    return true;
  }catch(e){
    console.error('storage set failed', key, e);
    toast('فشل الحفظ! تأكد إن النت شغال وحاول تاني');
    return false;
  }
}

// ============ BACKUP EXPORT / IMPORT ============
async function collectAllData(){
  const out = {};
  const keys = await idbListKeys();
  for(const k of keys){
    try{
      const v = await idbGet(k);
      out[k] = v ? JSON.parse(v) : null;
    }catch(e){
      out[k] = null;
    }
  }
  return out;
}

async function importBackup(file){
  if(!(await confirmModal('استيراد النسخة دي هيستبدل بيانات نفس المرضى/العيادات لو موجودين بنفس الأرقام. تكمل؟'))) return;
  try{
    const text = await file.text();
    const payload = JSON.parse(text);
    const data = payload && payload.data ? payload.data : payload; // tolerate raw dump too
    const keys = Object.keys(data || {}).filter(k => data[k] !== null && data[k] !== undefined);
    if(!keys.length){ toast('الملف فاضي أو مش صالح'); return; }

    // upload every key, tracking which ones actually succeeded — a partial failure must NOT
    // be reported as a full success (this silently dropped the inventory key once before)
    const failed = [];
    for(const k of keys){
      const ok = await setData(k, data[k]);
      if(!ok) failed.push(k);
    }
    // one retry pass for anything that failed (covers a transient network hiccup)
    if(failed.length){
      const stillFailed = [];
      for(const k of failed){
        const ok = await setData(k, data[k]);
        if(!ok) stillFailed.push(k);
      }
      failed.length = 0;
      failed.push(...stillFailed);
    }

    await loadClinics();
    state.view = 'clinics';
    render();

    if(failed.length){
      await alertModal('تم استيراد معظم البيانات، لكن الأجزاء دي فشلت في الرفع حتى بعد إعادة المحاولة:\n' + failed.join('\n') + '\n\nتأكد إن النت شغال ومستقر وحاول تستورد نفس الملف تاني.');
    } else {
      toast('اتضافت النسخة الاحتياطية بالكامل');
    }
  }catch(e){
    console.error('import failed', e);
    toast('فشل استيراد الملف — تأكد إنه ملف نسخة احتياطية صحيح');
  }
}

function confirmModal(message, opts={}){
  const confirmLabel = opts.confirmLabel || 'تأكيد';
  const cancelLabel = opts.cancelLabel || 'إلغاء';
  const danger = !!opts.danger;
  return new Promise(resolve=>{
    const bg = document.createElement('div');
    bg.className = 'modal-bg';
    bg.innerHTML = `
      <div class="modal">
        <h3>تأكيد</h3>
        <p style="font-size:14px;line-height:1.7;white-space:pre-line;margin:0 0 16px;color:var(--text);">${escapeHtml(message)}</p>
        <div class="modal-actions">
          <button class="secondary" id="modalCancelBtn">${escapeHtml(cancelLabel)}</button>
          <button class="${danger?'danger':''}" id="modalConfirmBtn">${escapeHtml(confirmLabel)}</button>
        </div>
      </div>
    `;
    document.body.appendChild(bg);
    const cleanup = (result) => { bg.remove(); document.removeEventListener('keydown', onKey); resolve(result); };
    document.getElementById('modalCancelBtn').onclick = () => cleanup(false);
    document.getElementById('modalConfirmBtn').onclick = () => cleanup(true);
    bg.onclick = (e) => { if(e.target === bg) cleanup(false); };
    function onKey(e){ if(e.key==='Escape') cleanup(false); }
    document.addEventListener('keydown', onKey);
    setTimeout(()=>{ const b = document.getElementById('modalConfirmBtn'); if(b) b.focus(); }, 50);
  });
}

function alertModal(message, opts={}){
  const title = opts.title || 'تنبيه';
  return new Promise(resolve=>{
    const bg = document.createElement('div');
    bg.className = 'modal-bg';
    bg.innerHTML = `
      <div class="modal">
        <h3>${escapeHtml(title)}</h3>
        <p style="font-size:14px;line-height:1.7;white-space:pre-line;margin:0 0 16px;color:var(--text);">${escapeHtml(message)}</p>
        <div class="modal-actions">
          <button id="modalOkBtn">تمام</button>
        </div>
      </div>
    `;
    document.body.appendChild(bg);
    const cleanup = () => { bg.remove(); document.removeEventListener('keydown', onKey); resolve(); };
    document.getElementById('modalOkBtn').onclick = cleanup;
    bg.onclick = (e) => { if(e.target === bg) cleanup(); };
    function onKey(e){ if(e.key==='Escape' || e.key==='Enter') cleanup(); }
    document.addEventListener('keydown', onKey);
    setTimeout(()=>{ const b = document.getElementById('modalOkBtn'); if(b) b.focus(); }, 50);
  });
}

function promptModal(title, defaultValue, opts={}){
  const placeholder = opts.placeholder || '';
  const type = opts.type || 'text';
  const label = opts.label || '';
  return new Promise(resolve=>{
    const bg = document.createElement('div');
    bg.className = 'modal-bg';
    bg.innerHTML = `
      <div class="modal">
        <h3>${escapeHtml(title)}</h3>
        <div class="field">
          ${label ? `<label>${escapeHtml(label)}</label>` : ''}
          <input type="${type}" id="modalPromptInput" value="${escapeHtml(defaultValue || '')}" placeholder="${escapeHtml(placeholder)}" style="width:100%;">
        </div>
        <div class="modal-actions">
          <button class="secondary" id="modalPromptCancelBtn">إلغاء</button>
          <button id="modalPromptOkBtn">حفظ</button>
        </div>
      </div>
    `;
    document.body.appendChild(bg);
    const input = document.getElementById('modalPromptInput');
    const cleanup = (result) => { bg.remove(); document.removeEventListener('keydown', onKey); resolve(result); };
    document.getElementById('modalPromptCancelBtn').onclick = () => cleanup(null);
    document.getElementById('modalPromptOkBtn').onclick = () => { const v = input.value.trim(); cleanup(v ? v : null); };
    bg.onclick = (e) => { if(e.target === bg) cleanup(null); };
    function onKey(e){
      if(e.key==='Escape') cleanup(null);
      if(e.key==='Enter'){ e.preventDefault(); const v = input.value.trim(); cleanup(v ? v : null); }
    }
    document.addEventListener('keydown', onKey);
    setTimeout(()=>{ input.focus(); if(type==='text') input.select(); }, 50);
  });
}

function buildWhatsappLink(raw){
  let digits = (raw||'').replace(/[^0-9]/g, '');
  if(!digits) return '#';
  // Egyptian local numbers (01xxxxxxxxx) -> country code 20, drop leading 0
  if(digits.length === 11 && digits.startsWith('0')){
    digits = '20' + digits.slice(1);
  }
  return 'https://wa.me/' + digits;
}

// days between today and a given YYYY-MM-DD date (negative = in the past)
function daysUntil(dateStr){
  if(!dateStr) return null;
  const today = new Date(todayStr()+'T00:00:00');
  const d = new Date(dateStr+'T00:00:00');
  return Math.round((d - today) / 86400000);
}
function formatDateAr(dateStr){
  if(!dateStr) return '-';
  const parts = dateStr.split('-');
  if(parts.length !== 3) return dateStr;
  return `${parts[2]}/${parts[1]}/${parts[0]}`;
}

// counts consecutive fully-completed calendar months (going backward from last month,
// not counting the current in-progress month) with no monthly-follow-up entry at all.
function computeMissedMonths(monthlyLog){
  const monthsWithEntries = new Set((monthlyLog||[]).map(e => (e.date||'').slice(0,7)));
  let count = 0;
  const d = new Date();
  d.setDate(1);
  d.setMonth(d.getMonth() - 1); // last fully-completed month
  for(let i=0;i<24;i++){
    const m = d.toISOString().slice(0,7);
    if(monthsWithEntries.has(m)) break;
    count++;
    d.setMonth(d.getMonth()-1);
  }
  return count;
}
function buildWhatsappLinkWithText(raw, text){
  const base = buildWhatsappLink(raw);
  if(base === '#') return '#';
  return base + '?text=' + encodeURIComponent(text || '');
}
function monthsSince(dateStr){
  if(!dateStr) return 0;
  const d = new Date(dateStr);
  const now = new Date();
  let months = (now.getFullYear() - d.getFullYear()) * 12 + (now.getMonth() - d.getMonth());
  if(now.getDate() < d.getDate()) months -= 1;
  return Math.max(0, months);
}

async function loadClinicPatientAggregates(clinicId, month){
  state.clinicSummaryLoading = true;
  let total = 0;
  const missedStatus = {};
  const bracketTypes = {};
  function applyFile(patientId, file){
    const payments = (file && file.payments) || [];
    payments.forEach(pay=>{
      if((pay.date||'').slice(0,7) === month){
        total += parseFloat(pay.amount) || 0;
      }
    });
    missedStatus[patientId] = computeMissedMonths(file && file.monthlyLog);
    bracketTypes[patientId] = (file && file.bracketSystem) || '';
  }
  try{
    if(state.patients.length){
      const keys = state.patients.map(p => '"patientfile:' + p.id + '"');
      await ensureFreshSession();
      const res = await fetch(
        SUPABASE_REST + '?key=in.(' + keys.join(',') + ')&select=key,value',
        { headers: supabaseHeaders() }
      );
      if(!res.ok) throw new Error('Supabase batch get failed: ' + res.status);
      const rows = await res.json();
      const byKey = {};
      rows.forEach(row=>{ byKey[row.key] = row.value; });
      state.patients.forEach(p=>{
        applyFile(p.id, byKey['patientfile:' + p.id]);
      });
    }
  }catch(e){
    console.error('clinic patient aggregates batch fetch failed', e);
    // fallback: old slower per-patient method, so the numbers still load even if batch fails
    for(const p of state.patients){
      const file = await getData('patientfile:' + p.id, { payments: [], monthlyLog: [] });
      applyFile(p.id, file);
    }
  }
  state.clinicSummaryTotal = total;
  state.clinicMissedStatus = missedStatus;
  state.clinicBracketTypes = bracketTypes;
  state.clinicSummaryLoading = false;
}

async function loadInventory(){
  state.inventory = await getData('inventory', []);
  let dirty = false;
  if(state.inventory.length === 0 && state.clinics.length){
    // one-time migration from old per-clinic inventory keys
    for(const c of state.clinics){
      const old = await getData('inventory:' + c.id, []);
      if(old && old.length){
        old.forEach(i=>{ if(!i.category) i.category = 'wires'; });
        state.inventory = state.inventory.concat(old);
        dirty = true;
      }
    }
  }
  state.inventory.forEach(i=>{
    if(!i.category){ i.category = 'wires'; dirty = true; }
  });

  state.inventoryCategories = await getData('inventoryCategories', null);
  if(!state.inventoryCategories){
    state.inventoryCategories = DEFAULT_INVENTORY_CATEGORIES.slice();
  }
  let categoriesDirty = false;
  if(!state.inventoryCategories.some(c=>c.id === BRACKET_CATEGORY_ID)){
    state.inventoryCategories.push({ id: BRACKET_CATEGORY_ID, label: 'براكيت' });
    categoriesDirty = true;
  }
  if(!state.inventoryCategories.some(c=>c.id === REVEAL_CATEGORY_ID)){
    state.inventoryCategories.push({ id: REVEAL_CATEGORY_ID, label: 'ريفيل ROTH', toothChart: true });
    categoriesDirty = true;
  } else {
    const rothCat = state.inventoryCategories.find(c=>c.id === REVEAL_CATEGORY_ID);
    if(rothCat && rothCat.label !== 'ريفيل ROTH'){ rothCat.label = 'ريفيل ROTH'; categoriesDirty = true; }
  }
  if(!state.inventoryCategories.some(c=>c.id === REVEAL_MBT_CATEGORY_ID)){
    state.inventoryCategories.push({ id: REVEAL_MBT_CATEGORY_ID, label: 'ريفيل MBT', toothChart: true });
    categoriesDirty = true;
  }
  if(categoriesDirty) await saveInventoryCategories();

  // ensure the two bracket sub-items (ROTH / MBT) exist under the main "براكيت" category
  const hasBracketRothItem = state.inventory.some(i=>i.category===BRACKET_CATEGORY_ID && /roth/i.test(i.name||''));
  if(!hasBracketRothItem){
    state.inventory.push({ id: uid(), name: 'Bracket ROTH', qty: 0, threshold: 4, category: BRACKET_CATEGORY_ID, type:'', supplier:'', supplierWhatsapp:'', price:0 });
    dirty = true;
  }
  const hasBracketMbtItem = state.inventory.some(i=>i.category===BRACKET_CATEGORY_ID && /mbt/i.test(i.name||''));
  if(!hasBracketMbtItem){
    state.inventory.push({ id: uid(), name: 'Bracket MBT', qty: 0, threshold: 4, category: BRACKET_CATEGORY_ID, type:'', supplier:'', supplierWhatsapp:'', price:0 });
    dirty = true;
  }
  // repair: an earlier version of this seeding set threshold to -1, which silently disabled the
  // low-stock alert for these two items forever — fix any already-created ones back to a real threshold
  state.inventory.forEach(i=>{
    if(i.category === BRACKET_CATEGORY_ID && (/roth/i.test(i.name||'') || /mbt/i.test(i.name||'')) && parseFloat(i.threshold) === -1){
      i.threshold = 4;
      dirty = true;
    }
  });

  // repair: rename any reveal item still using the old FDI-based name (e.g. "فص 28") to Palmer ("فص UL8")
  state.inventory.forEach(i=>{
    if((i.category === REVEAL_CATEGORY_ID || i.category === REVEAL_MBT_CATEGORY_ID) && i.toothNum){
      const expectedName = 'فص ' + fdiToPalmer(i.toothNum);
      if(i.name !== expectedName){ i.name = expectedName; dirty = true; }
    }
  });

  // ensure a stock item exists for every tooth position under each Reveal (tooth-chart) category
  const revealNums = [...FDI_TEETH_ROWS.upper, ...FDI_TEETH_ROWS.lower];
  [REVEAL_CATEGORY_ID, REVEAL_MBT_CATEGORY_ID].forEach(catId=>{
    const existingRevealNums = new Set(state.inventory.filter(i=>i.category===catId).map(i=>i.toothNum));
    revealNums.forEach(num=>{
      if(!existingRevealNums.has(num)){
        state.inventory.push({ id: uid(), name: 'فص ' + fdiToPalmer(num), qty: 0, threshold: -1, category: catId, toothNum: num, type:'', supplier:'', supplierWhatsapp:'', price:0 });
        dirty = true;
      }
    });
  });

  if(dirty) await saveInventory();
}

// Standard diagnosis sheet — auto-created for every new patient so nothing needs to be added manually
function buildDefaultDiagnosisSections(){
  const mkField = (l, options) => ({ id: uid(), label: l, value: '', options: options || null });
  const mkGroup = (title, labels) => ({ id: uid(), title, fields: labels.map(l => Array.isArray(l) ? mkField(l[0], l[1]) : mkField(l)) });
  const mk = (title, opts) => ({
    id: uid(),
    title,
    groups: opts.groups || [],
    fields: (opts.fields || []).map(l => Array.isArray(l) ? mkField(l[0], l[1]) : mkField(l)),
    content: '',
    col1: opts.col1 || null,
    col2: opts.col2 || null
  });
  return [
    mk('Chief Complaint', {}),
    mk('Extra-oral', {
      groups: [
        mkGroup('Frontal', [
          'At rest',
          'At smile',
          ['Lip line', ['Normal', 'Gummy smile', 'Low smile (canine smile)']],
          ['Lip length', ['Normal', 'Short', 'Long']],
          ['Buccal corridor', ['Normal', 'Narrow', 'Wide']],
          ['Facial height', ['Normal', 'Increased (long face)', 'Decreased (short face)']],
          ['Facial symmetry', ['Symmetric', 'Asymmetric']]
        ]),
        mkGroup('Lateral', [
          ['Nasolabial angle', ['Acute', 'Normal', 'Obtuse']],
          ['Profile', ['Straight', 'Convex', 'Concave']],
          ['Lip competence', ['Competent', 'Incompetent']],
          ['E line', ['Lips within E-line', 'Protrusive', 'Retrusive']],
          ['Lip line', ['Normal', 'Gummy smile', 'Low smile (canine smile)']]
        ])
      ]
    }),
    mk('Intra-oral', {
      groups: [
        mkGroup('Frontal', [
          ['Overjet', ['Normal', 'Increased', 'Reverse (crossbite)']],
          ['Overbite', ['Normal', 'Deep', 'Open']],
          ['Midline', ['Coincident', 'Shifted right', 'Shifted left']]
        ]),
        mkGroup('Upper', [
          ['Arch form', ['U-shaped', 'V-shaped', 'Square', 'Tapered']],
          ['Incisor inclination', ['Proclined', 'Normal', 'Retroclined']],
          ['Midline', ['Coincident', 'Shifted right', 'Shifted left']],
          ['Rotation', ['None', 'Mild', 'Severe']],
          ['Crowding', ['None', 'Mild', 'Moderate', 'Severe']]
        ]),
        mkGroup('Lower', [
          ['Arch form', ['U-shaped', 'V-shaped', 'Square', 'Tapered']],
          ['Incisor inclination', ['Proclined', 'Normal', 'Retroclined']],
          ['Midline', ['Coincident', 'Shifted right', 'Shifted left']],
          ['Rotation', ['None', 'Mild', 'Severe']],
          ['Crowding', ['None', 'Mild', 'Moderate', 'Severe']]
        ])
      ],
      fields: ['Panorama']
    }),
    mk('Cephalometric', {
      fields: ['SNA', 'SNB', 'ANB', 'FMA', 'SN-MAN', 'U1-SN', 'L1-MAN', 'U1-L1', 'Nasolabial angle']
    }),
    mk('Classification', {
      fields: [
        ['Right - Molar', ['Class I', 'Class II full unit', 'Class II 1/2', 'Class II 1/4', 'Class III full unit', 'Class III 1/2', 'Class III 1/4']],
        ['Right - Canine', ['Class I', 'Class II full unit', 'Class II 1/2', 'Class II 1/4', 'Class III full unit', 'Class III 1/2', 'Class III 1/4']],
        ['Right - Buccal', ['Class I', 'Class II full unit', 'Class II 1/2', 'Class II 1/4', 'Class III full unit', 'Class III 1/2', 'Class III 1/4']],
        ['Left - Molar', ['Class I', 'Class II full unit', 'Class II 1/2', 'Class II 1/4', 'Class III full unit', 'Class III 1/2', 'Class III 1/4']],
        ['Left - Canine', ['Class I', 'Class II full unit', 'Class II 1/2', 'Class II 1/4', 'Class III full unit', 'Class III 1/2', 'Class III 1/4']],
        ['Left - Buccal', ['Class I', 'Class II full unit', 'Class II 1/2', 'Class II 1/4', 'Class III full unit', 'Class III 1/2', 'Class III 1/4']]
      ]
    }),
    mk('Problem List and Mechanics', {
      col1: 'Problems', col2: 'Mechanics',
      fields: ['', '', '', '', '', '']
    }),
    mk('Space Management / Anchorage', {
      fields: ['Space management', 'Anchorage', 'Tooth out of wire', 'Wire sequence', 'Bite turbo']
    }),
    mk('Treatment Plan', { fields: ['Extraction / Non-extraction', 'Upper plan', 'Lower plan'] })

}


// One-time migration: add the new option-based fields to patient files created
// before these fields existed, without touching anything the user already filled in.
function migrateExtraOralFrontalFields(sections){
  let changed = false;

  function addOptionsToField(group, label, options){
    if(!group) return;
    const f = (group.fields || []).find(x => x.label.trim().toLowerCase() === label.toLowerCase());
    if(f && !f.options){ f.options = options; changed = true; }
  }
  function addNewField(group, label, options){
    if(!group) return;
    const exists = (group.fields || []).some(x => x.label.trim().toLowerCase() === label.toLowerCase());
    if(!exists){ group.fields.push({ id: uid(), label, value: '', options }); changed = true; }
  }

  const extraOral = sections.find(s => s.title === 'Extra-oral');
  if(extraOral){
    const frontal = (extraOral.groups || []).find(g => g.title === 'Frontal');
    addNewField(frontal, 'Lip length', ['Normal', 'Short', 'Long']);
    addNewField(frontal, 'Buccal corridor', ['Normal', 'Narrow', 'Wide']);
    addNewField(frontal, 'Facial height', ['Normal', 'Increased (long face)', 'Decreased (short face)']);
    addNewField(frontal, 'Facial symmetry', ['Symmetric', 'Asymmetric']);
    addOptionsToField(frontal, 'Lip line', ['Normal', 'Gummy smile', 'Low smile (canine smile)']);

    const lateral = (extraOral.groups || []).find(g => g.title === 'Lateral');
    addOptionsToField(lateral, 'Nasolabial angle', ['Acute', 'Normal', 'Obtuse']);
    addOptionsToField(lateral, 'Profile', ['Straight', 'Convex', 'Concave']);
    addOptionsToField(lateral, 'Lip competence', ['Competent', 'Incompetent']);
    addOptionsToField(lateral, 'E line', ['Lips within E-line', 'Protrusive', 'Retrusive']);
    addOptionsToField(lateral, 'Lip line', ['Normal', 'Gummy smile', 'Low smile (canine smile)']);
  }

  const intraOral = sections.find(s => s.title === 'Intra-oral');
  if(intraOral){
    const iFrontal = (intraOral.groups || []).find(g => g.title === 'Frontal');
    addOptionsToField(iFrontal, 'Overjet', ['Normal', 'Increased', 'Reverse (crossbite)']);
    addOptionsToField(iFrontal, 'Overbite', ['Normal', 'Deep', 'Open']);
    addOptionsToField(iFrontal, 'Midline', ['Coincident', 'Shifted right', 'Shifted left']);

    ['Upper', 'Lower'].forEach(gname => {
      const g = (intraOral.groups || []).find(x => x.title === gname);
      addOptionsToField(g, 'Arch form', ['U-shaped', 'V-shaped', 'Square', 'Tapered']);
      addOptionsToField(g, 'Incisor inclination', ['Proclined', 'Normal', 'Retroclined']);
      addOptionsToField(g, 'Midline', ['Coincident', 'Shifted right', 'Shifted left']);
      addOptionsToField(g, 'Rotation', ['None', 'Mild', 'Severe']);
      addOptionsToField(g, 'Crowding', ['None', 'Mild', 'Moderate', 'Severe']);
    });
  }

  const classification = sections.find(s => s.title === 'Classification');
  if(classification){
    const classOptions = ['Class I', 'Class II full unit', 'Class II 1/2', 'Class II 1/4', 'Class III full unit', 'Class III 1/2', 'Class III 1/4'];
    (classification.fields || []).forEach(f => {
      if(!f.options){ f.options = classOptions; changed = true; }
    });
  }

  return changed;
}

// ============ RENDER ROOT ============
function renderFatalErrorScreen(err){
  console.error('fatal render/boot error', err);
  const app = document.getElementById('app');
  if(!app) return;
  app.innerHTML = `
    <div class="empty-state" style="padding:40px 16px;">
      <div style="font-size:16px;font-weight:700;margin-bottom:8px;">تعذر تحميل النظام</div>
      <div style="color:var(--muted);margin-bottom:18px;">حصلت مشكلة أثناء الاتصال أو تحميل البيانات. تأكد إن النت شغال وحاول تاني.</div>
      <div class="row" style="justify-content:center;gap:10px;">
        <button id="fatalRetryBtn">حاول تاني</button>
        <button class="secondary" id="fatalLoginBtn">ارجع لشاشة الدخول</button>
      </div>
    </div>
  `;
  document.getElementById('fatalRetryBtn').onclick = () => location.reload();
  document.getElementById('fatalLoginBtn').onclick = () => supabaseLogout();
}

async function render(){
  const app = document.getElementById('app');
  try{
    if(state.view === 'clinics'){
      await loadInventory();
      app.innerHTML = renderClinicsView();
      attachClinicsHandlers();
    } else if(state.view === 'patients'){
      app.innerHTML = renderPatientsView();
      attachPatientsHandlers();
    } else if(state.view === 'patient'){
      app.innerHTML = await renderPatientView();
      attachPatientHandlers();
    } else if(state.view === 'inventory'){
      app.innerHTML = renderInventoryView();
      attachInventoryHandlers();
    }
  }catch(err){
    renderFatalErrorScreen(err);
  }
}

function attachClinicsHandlers(){
  document.getElementById('addClinicBtn').onclick = () => openClinicModal();
  document.getElementById('editDoctorNameBtn').onclick = () => openEditDoctorNameModal();
  document.getElementById('openInventoryBtnGlobal').onclick = async () => {
    await loadInventory();
    state.view = 'inventory';
    state.inventoryFrom = 'clinics';
    render();
  };
  document.getElementById('exportBackupBtn').onclick = () => exportBackup();
  document.getElementById('importBackupBtn').onclick = () => document.getElementById('importBackupFile').click();
  document.getElementById('importBackupFile').onchange = (e) => {
    const file = e.target.files[0];
    if(file) importBackup(file);
    e.target.value = '';

function renderPatientListHtml(){
  const term = state.searchTerm.trim().toLowerCase();
  let list = state.patients.filter(p => !term || p.name.toLowerCase().includes(term) || (p.number||'').includes(term));

  if(state.patientSortMode === 'number'){
    list = [...list].sort((a,b)=> (parseInt(a.number,10)||0) - (parseInt(b.number,10)||0) || a.name.localeCompare(b.name,'ar'));
  } else {
    list = [...list].sort((a,b)=> a.name.localeCompare(b.name, 'ar'));
  }

  if(!list.length){
    return `<div class="empty-state">${state.patients.length ? 'مفيش نتائج للبحث ده' : 'لسه مفيش مرضى في العيادة دي'}</div>`;
  }
  let lastLetter = null;
  let html = '<ul class="patient-list">';
  list.forEach(p=>{
    if(state.patientSortMode === 'alpha'){
      const letter = p.name.trim()[0];
      if(letter !== lastLetter){
        html += `<li class="letter-heading">${letter}</li>`;
        lastLetter = letter;
      }
    }
    const missed = state.clinicMissedStatus ? (state.clinicMissedStatus[p.id] || 0) : 0;
    const bracketType = state.clinicBracketTypes ? (state.clinicBracketTypes[p.id] || '') : '';
    html += `
      <li class="patient-item" data-id="${p.id}">
        <div>
          <div class="pname">${escapeHtml(p.name)}</div>
          <div class="pnum">رقم: ${escapeHtml(p.number || '-')}</div>
          <div class="pcontact">
            ${p.phone ? `<a class="wa-btn small" data-wa-link href="${buildWhatsappLinkWithText(p.phone, buildPatientGreetingMessage(p))}" target="_blank" rel="noopener">💬 ${escapeHtml(p.phone)}</a>` : `<span class="pmeta">مفيش رقم موبايل</span>`}
            <span class="pmeta">نوع البراكيت: ${bracketSystemLabel(bracketType)}</span>
          </div>
          ${missed >= 2 ? `<div style="margin-top:4px;"><span class="appt-badge overdue stock-alert-blink">⚠ مجاش من ${missed} شهر</span></div>` : ''}
        </div>
        <div style="color:var(--muted);font-size:18px;">‹</div>
      </li>
    `;
  });
  html += '</ul>';
  return html;
}

// ============ INVENTORY VIEW ============
const DEFAULT_INVENTORY_CATEGORIES = [
  { id: 'wires', label: 'وايرز' },
  { id: 'accessories', label: 'أكسسوريز' },
  { id: 'elastics', label: 'إيلاستيك' },
  { id: 'otie', label: 'أوتاي' }
];
const BRACKET_CATEGORY_ID = 'bracket';
const REVEAL_CATEGORY_ID = 'reveal';
const REVEAL_MBT_CATEGORY_ID = 'reveal_mbt';
const REFILL_ALERT_THRESHOLD = 2; // refill (reveal) items alert when qty drops below this

// Unified low-stock check: refill (per-tooth) items alert below REFILL_ALERT_THRESHOLD,
// everything else alerts using its own "threshold" field.
function isLowStockItem(item){
  const qty = parseFloat(item.qty) || 0;
  if(item.category === REVEAL_CATEGORY_ID || item.category === REVEAL_MBT_CATEGORY_ID) return qty < REFILL_ALERT_THRESHOLD;
  const th = parseFloat(item.threshold) || 0;
  return qty <= th;
}

function renderInventoryCategoriesHtml(){
  const term = (state.inventorySearch||'').trim().toLowerCase();
  const PROTECTED_CATEGORY_IDS = new Set([BRACKET_CATEGORY_ID]);
  return state.inventoryCategories.map(cat=>{
    const isProtected = PROTECTED_CATEGORY_IDS.has(cat.id);
    const mainCatActionsHtml = isProtected ? '' : `
      <button class="secondary small" data-edit-main-cat="${cat.id}">تعديل</button>
      <button class="danger small" data-del-main-cat="${cat.id}">حذف</button>
    `;
    if(cat.toothChart){
      return `
        <div class="card">
          <div class="row" style="justify-content:space-between;">
            <div class="section-title" style="margin:0;">${escapeHtml(cat.label)}</div>
            <div class="row" style="gap:6px;">
              <button class="secondary small" data-bulk-restock="${cat.id}">📦 توريد جماعي — ${escapeHtml(cat.label)}</button>
              ${mainCatActionsHtml}
            </div>
          </div>
          ${renderRevealCategoryBody(cat)}
        </div>
      `;
    }
    let items = state.inventory.filter(i => i.category === cat.id);
    if(term) items = items.filter(i => i.name.toLowerCase().includes(term));
    items = [...items].sort((a,b)=> a.name.localeCompare(b.name, 'ar'));

    const bodyHtml = items.length ? `
      <table class="diag-table" style="margin-top:10px;">
        <thead><tr>
          <th>الصنف</th><th>الكمية</th><th>حد الإنذار</th><th>النوع</th><th>المورد</th><th>السعر</th><th></th>
        </tr></thead>
        <tbody>
          ${items.map(i=>{
            const qty = parseFloat(i.qty) || 0;
            const th = parseFloat(i.threshold) || 0;
            const low = isLowStockItem(i);
            const price = parseFloat(i.price) || 0;
            return `
              <tr${low ? ' class="low-stock-row"' : ''}>
                <td>${escapeHtml(i.name)}${low ? ' <span class="stock-alert-blink" style="color:var(--red);font-size:11px;border:none;background:none;padding:1px 5px;border-radius:6px;">⚠️ ناقص</span>' : ''}</td>
                <td style="font-weight:700;${low ? 'color:var(--red);' : ''}">${qty}</td>
                <td style="color:var(--muted);">${th}</td>
                <td style="color:var(--muted);">${escapeHtml(i.type||'')}</td>
                <td style="color:var(--muted);">
                  ${i.supplierWhatsapp ? `<a href="${buildWhatsappLink(i.supplierWhatsapp)}" target="_blank" rel="noopener" style="color:var(--green);text-decoration:none;">${escapeHtml(i.supplier||'واتساب')} 💬</a>` : escapeHtml(i.supplier||'')}
                </td>
                <td style="color:var(--muted);">${price ? price.toLocaleString() + ' جنيه' : ''}</td>
                <td>
                  <div class="row" style="gap:6px;flex-wrap:nowrap;">
                    <button class="secondary small" data-use="${i.id}">− استخدام</button>
                    <button class="secondary small" data-restock="${i.id}">+ توريد</button>
                    <button class="secondary small" data-edit-item="${i.id}">تعديل</button>
                    <button class="danger small" data-del-item="${i.id}">حذف</button>
                  </div>
                </td>
              </tr>
            `;
          }).join('')}
        </tbody>
      </table>
    ` : `<div class="placeholder" style="margin-top:10px;">${term ? 'مفيش نتائج' : 'مفيش أصناف في القسم ده لسه'}</div>`;

    return `
      <div class="card">
        <div class="row" style="justify-content:space-between;">
          <div class="section-title" style="margin:0;">${escapeHtml(cat.label)}</div>
          <div class="row" style="gap:6px;">
            ${cat.id === BRACKET_CATEGORY_ID ? `<button class="secondary small" data-bulk-restock="${cat.id}">📦 توريد جماعي لكل البراكيت</button>` : ''}
            <button class="secondary small" data-add-item="${cat.id}">+ إضافة صنف</button>
            ${mainCatActionsHtml}
          </div>
        </div>
        ${bodyHtml}
      </div>
    `;
  }).join('');
}

function renderRevealToothBox(item){
  const qty = parseFloat(item && item.qty) || 0;
  const out = qty <= 0;
  const low = !out && qty < REFILL_ALERT_THRESHOLD;
  return `
    <div class="tooth reveal-tooth ${out?'broken':(low?'low-refill':'')}" data-reveal-item="${item.id}" title="${escapeHtml(item.name)} — الكمية المتاحة: ${qty}${low ? ' ⚠ ناقص' : ''}">
      <span class="badge">${qty}</span>
      ${fdiToPalmer(item.toothNum)}
    </div>
  `;
}

function renderRevealCategoryBody(cat){
  const items = state.inventory.filter(i => i.category === cat.id);
  const byTooth = {};
  items.forEach(i => byTooth[i.toothNum] = i);
  const upperRow = FDI_TEETH_ROWS.upper.map((n,i)=> (i===8?'<div class="quad-gap"></div>':'') + renderRevealToothBox(byTooth[n])).join('');
  const lowerRow = FDI_TEETH_ROWS.lower.map((n,i)=> (i===8?'<div class="quad-gap"></div>':'') + renderRevealToothBox(byTooth[n])).join('');
  return `
    <div class="tooth-arch">
      <div class="arch-label">الفك العلوي (Upper)</div>
      <div class="tooth-row">${upperRow}</div>
    </div>
    <div class="tooth-arch">
      <div class="arch-label">الفك السفلي (Lower)</div>
      <div class="tooth-row">${lowerRow}</div>
    </div>
    <div class="placeholder" style="text-align:right;padding:10px;">دوس على أي فص عشان تعدّل الكمية المتاحة منه، أو دبل كليك عشان تخصم وحدة واحدة منه على طول — والعدد بينقص لوحده كمان لما يتستخدم من تبويب "المتابعة الشهرية" لأي مريض</div>
  `;
}

let revealClickTimer = null;
function attachInventoryCategoryHandlers(){
  document.querySelectorAll('[data-reveal-item]').forEach(el=>{
    // single click opens the edit-qty modal; double click deducts one unit immediately.
    // click is delayed briefly so a fast second click (dblclick) can cancel it.
    el.onclick = () => {
      const itemId = el.dataset.revealItem;
      if(revealClickTimer) clearTimeout(revealClickTimer);
      revealClickTimer = setTimeout(() => { revealClickTimer = null; openEditRevealQtyModal(itemId); }, 250);
    };
    el.ondblclick = (e) => {
      e.preventDefault();
      if(revealClickTimer){ clearTimeout(revealClickTimer); revealClickTimer = null; }
      quickDeductRevealItem(el.dataset.revealItem);
    };
  });
  document.querySelectorAll('[data-add-item]').forEach(el=>{
    el.onclick = () => openAddInventoryItemModal(el.dataset.addItem);
  });
  document.querySelectorAll('[data-use]').forEach(el=>{
    el.onclick = () => adjustInventoryQty(el.dataset.use, -1);
  });
  document.querySelectorAll('[data-bulk-restock]').forEach(el=>{
    el.onclick = () => openBulkRestockModal(el.dataset.bulkRestock);
  });
  document.querySelectorAll('[data-restock]').forEach(el=>{
    el.onclick = () => openRestockModal(el.dataset.restock);
  });
  document.querySelectorAll('[data-edit-item]').forEach(el=>{
    el.onclick = () => openEditInventoryItemModal(el.dataset.editItem);
  });
  document.querySelectorAll('[data-del-item]').forEach(el=>{
    el.onclick = () => deleteInventoryItem(el.dataset.delItem);
  });
  document.querySelectorAll('[data-edit-main-cat]').forEach(el=>{
    el.onclick = () => openEditMainCategoryModal(el.dataset.editMainCat);
  });
  document.querySelectorAll('[data-del-main-cat]').forEach(el=>{

  });
}

async function deleteMainCategory(catId){
  const PROTECTED_CATEGORY_IDS = new Set([BRACKET_CATEGORY_ID]);
  if(PROTECTED_CATEGORY_IDS.has(catId)){
    toast('مينفعش تمسح الصنف الرئيسي ده — أساسي في النظام');
    return;
  }
  const cat = state.inventoryCategories.find(c=>c.id === catId);
  if(!cat) return;
  const itemsCount = state.inventory.filter(i=>i.category===catId).length;
  const msg = itemsCount
    ? `حذف "${cat.label}" هيمسح معاه كل الأصناف اللي جواه (${itemsCount} صنف). متأكد؟`
    : `حذف "${cat.label}"؟`;
  if(!(await confirmModal(msg, {danger:true}))) return;
  state.inventoryCategories = state.inventoryCategories.filter(c=>c.id !== catId);
  state.inventory = state.inventory.filter(i=>i.category !== catId);
  await saveInventoryCategories();
  await saveInventory();
  toast('اتمسح الصنف الرئيسي');
  render();
}

  await saveInventory();
  await logActivity('adjust_inventory', `${delta < 0 ? 'استخدم' : 'أضاف'} ${Math.abs(delta)} من "${item.name}" (الكمية بقت ${item.qty})`);
  render();
  if(isLowStockItem(item)){
    toast('⚠️ ' + item.name + ' وصل لحد الإنذار (' + item.qty + ')');
  }
}

function findDiagSection(file, title){
  return (file.diagnosisSections||[]).find(s=>s.title===title);
}
function findDiagField(section, label){
  if(!section) return '';
  const f = (section.fields||[]).find(x=>x.label===label);
  return f ? (f.value||'') : '';
}

function renderOverviewTab(){
  const file = state.currentPatientFile;

  const chief = findDiagSection(file, 'Chief Complaint');
  const chiefText = chief ? (chief.content||'') : '';

  const txPlan = findDiagSection(file, 'Treatment Plan');
  const extraction = findDiagField(txPlan, 'Extraction / Non-extraction');
  const upperPlan = findDiagField(txPlan, 'Upper plan');
  const lowerPlan = findDiagField(txPlan, 'Lower plan');

  const spaceAnchor = findDiagSection(file, 'Space Management / Anchorage');
  const anchorage = findDiagField(spaceAnchor, 'Anchorage');

  const log = file.monthlyLog || [];
  const sortedLog = [...log].sort((a,b)=>(b.date||'').localeCompare(a.date||''));
  const lastEntry = sortedLog[0] || null;
  const lastDoneText = lastEntry
    ? [lastEntry.doneUpper, lastEntry.doneLower, lastEntry.doneBoth !== undefined ? lastEntry.doneBoth : lastEntry.done].filter(Boolean).join(' | ')
    : '';
  const lastHygieneEntry = sortedLog.find(e=>e.hygieneRating);

  const bm = ensureBracketMap(file);
  const allNums = [...FDI_TEETH_ROWS.upper, ...FDI_TEETH_ROWS.lower];
  const brokenNow = allNums.filter(n=>bm.teeth[n].status==='broken').length;

  const total = parseFloat(file.financeTotal) || 0;
  const extrasSum = (file.financeExtras||[]).reduce((s,e)=>s+(parseFloat(e.amount)||0),0);
  const paidSum = (file.payments||[]).reduce((s,p)=>s+(parseFloat(p.amount)||0),0);
  const caseValue = total + extrasSum;
  const remaining = caseValue - paidSum;

  const stageCounts = computeStageCounts(file);
  let lastStageLabel = '', lastStageDate = '';
  TREATMENT_STAGES.forEach(st=>{
    (stageCounts[st.id]||[]).forEach(e=>{
      if(!lastStageDate || (e.date||'') > lastStageDate){ lastStageDate = e.date||''; lastStageLabel = st.label; }
    });

  return `
    <div class="overview-grid">
      <div class="overview-card">
        <div class="overview-card-title">خطة العلاج</div>
        ${chiefText ? `<div class="overview-row"><span class="ov-lbl">Chief Complaint</span><span class="ov-val">${escapeHtml(chiefText)}</span></div>` : ''}

        <div class="overview-row"><span class="ov-lbl">Upper plan</span><span class="ov-val">${upperPlan ? escapeHtml(upperPlan) : '—'}</span></div>
        <div class="overview-row"><span class="ov-lbl">Lower plan</span><span class="ov-val">${lowerPlan ? escapeHtml(lowerPlan) : '—'}</span></div>
        <div class="overview-row"><span class="ov-lbl">Anchorage</span><span class="ov-val">${anchorage ? escapeHtml(anchorage) : '—'}</span></div>
      </div>

      <div class="overview-card">
        <div class="overview-card-title">آخر متابعة</div>
        ${lastEntry ? `
          <div class="overview-row"><span class="ov-lbl">التاريخ</span><span class="ov-val">${escapeHtml(lastEntry.date||'')}</span></div>
          <div class="overview-row"><span class="ov-lbl">اللي اتعمل</span><span class="ov-val">${escapeHtml(lastDoneText || '—')}</span></div>
        ` : `<div class="placeholder">لسه مفيش متابعة مسجلة</div>`}
        ${lastHygieneEntry ? `<div class="overview-row"><span class="ov-lbl">آخر تقييم نظافة</span><span class="ov-val"><span class="hygiene-chip ${HYGIENE_CLASS[lastHygieneEntry.hygieneRating]}">${HYGIENE_LABELS[lastHygieneEntry.hygieneRating]}</span></span></div>` : ''}
      </div>

const PHOTO_INTRAORAL_SLOTS = [
  {id:'frontal', label:'Frontal'},
  {id:'occlusalUpper', label:'Occlusal Upper'},
  {id:'occlusalLower', label:'Occlusal Lower'},
  {id:'right', label:'Right'},
  {id:'left', label:'Left'}
];
const PHOTO_EXTRAORAL_SLOTS = [
  {id:'frontalRest', label:'Frontal Rest'},
  {id:'frontalSmile', label:'Frontal Smile'},
  {id:'profile', label:'Profile'}
];
// records/radiographs — only shown for "before" and "after" (not the recurring "during" visits)
const PHOTO_RECORDS_SLOTS = [
  {id:'occlusalPlan', label:'Occlusal Plan'},
  {id:'lateralCeph', label:'Lateral Ceph'},
  {id:'panorama', label:'Panorama'}
];
const PHOTO_STORAGE_BUCKET = 'patient-photos';

function emptyPhotoSection(withRecords){
  const s = {extraoral:{}, intraoral:{}};
  if(withRecords) s.records = {};
  return s;
}

function ensurePhotos(file){
  if(!file.photos) file.photos = { before: emptyPhotoSection(true), after: emptyPhotoSection(true), during: [] };
  if(!file.photos.before) file.photos.before = emptyPhotoSection(true);
  if(!file.photos.before.extraoral) file.photos.before.extraoral = {};
  if(!file.photos.before.intraoral) file.photos.before.intraoral = {};
  if(!file.photos.before.records) file.photos.before.records = {};
  if(!file.photos.after) file.photos.after = emptyPhotoSection(true);
  if(!file.photos.after.extraoral) file.photos.after.extraoral = {};
  if(!file.photos.after.intraoral) file.photos.after.intraoral = {};
  if(!file.photos.after.records) file.photos.after.records = {};
  if(!file.photos.during) file.photos.during = [];
  return file.photos;
}

// resizes + re-encodes the image client-side before upload so the free storage quota goes further
async function compressImageFile(file, maxDim, quality){
  maxDim = maxDim || 1400;
  quality = quality || 0.8;
  const imgUrl = URL.createObjectURL(file);
  try{
    const img = await new Promise((resolve, reject) => {
      const im = new Image();
      im.onload = () => resolve(im);
      im.onerror = reject;
      im.src = imgUrl;
    });
    let w = img.width, h = img.height;
    if(w > h && w > maxDim){ h = Math.round(h * maxDim / w); w = maxDim; }
    else if(h >= w && h > maxDim){ w = Math.round(w * maxDim / h); h = maxDim; }
    const canvas = document.createElement('canvas');
    canvas.width = w; canvas.height = h;
    canvas.getContext('2d').drawImage(img, 0, 0, w, h);
    const blob = await new Promise(resolve => canvas.toBlob(resolve, 'image/jpeg', quality));
    return blob || file;
  }catch(e){
    console.error('compress failed, uploading original', e);
    return file;
  }finally{
    URL.revokeObjectURL(imgUrl);
  }
}

async function uploadPhotoToStorage(blob, path){
  await ensureFreshSession();
  const res = await fetch(`${SUPABASE_URL}/storage/v1/object/${PHOTO_STORAGE_BUCKET}/${path}`, {
    method: 'POST',
    headers: supabaseHeaders({ 'Content-Type': 'image/jpeg', 'x-upsert': 'true' }),
    body: blob
  });
  if(!res.ok){
    const t = await res.text().catch(()=> '');
    throw new Error('Storage upload failed: ' + res.status + ' ' + t);
  }
  // bucket is private now — this "public" URL only works once we generate a signed URL for it,
  // which happens lazily via refreshPhotoUrlCache() whenever the Photos tab is rendered
  return `${SUPABASE_URL}/storage/v1/object/public/${PHOTO_STORAGE_BUCKET}/${path}`;
}

// signs a batch of storage paths at once (one request instead of one per photo) and caches
// the temporary signed URLs in state.photoUrlCache, keyed by path; signed URLs expire after
// PHOTO_SIGNED_URL_TTL seconds so a copied/leaked link stops working on its own
const PHOTO_SIGNED_URL_TTL = 3600; // 1 hour
async function refreshPhotoUrlCache(paths){
  const now = Date.now();
  const needed = [...new Set((paths || []).filter(Boolean))]
    .filter(p => !state.photoUrlCache[p] || state.photoUrlCache[p].expiresAt < now);
  if(!needed.length) return;
  try{
    await ensureFreshSession();
    const res = await fetch(`${SUPABASE_URL}/storage/v1/object/sign/${PHOTO_STORAGE_BUCKET}`, {
      method: 'POST',
      headers: supabaseHeaders(),
      body: JSON.stringify({ expiresIn: PHOTO_SIGNED_URL_TTL, paths: needed })
    });
    if(!res.ok) throw new Error('Storage sign batch failed: ' + res.status);
    const rows = await res.json();
    (rows || []).forEach(r=>{
      if(r && r.signedURL && !r.error){
        const full = r.signedURL.startsWith('http') ? r.signedURL : `${SUPABASE_URL}/storage/v1${r.signedURL}`;
        state.photoUrlCache[r.path] = { url: full, expiresAt: now + (PHOTO_SIGNED_URL_TTL - 60) * 1000 };
      }
    });
  }catch(e){
    console.error('refreshPhotoUrlCache failed', e);
  }
}

// reads the cached signed URL for a stored photo object; falls back to the old .url field
// (harmless if the bucket is still public, dead if it's private — either way not a crash)
function resolvePhotoUrl(photoObj){
  if(!photoObj) return '';
  const cached = photoObj.path && state.photoUrlCache[photoObj.path];
  return (cached && cached.url) || photoObj.url || '';
}

function collectPhotoPaths(photos){
  const paths = [];
  const grab = (obj) => { if(obj) Object.values(obj).forEach(s => { if(s && s.path) paths.push(s.path); }); };
  if(photos.before){ grab(photos.before.extraoral); grab(photos.before.intraoral); grab(photos.before.records); }
  if(photos.after){ grab(photos.after.extraoral); grab(photos.after.intraoral); grab(photos.after.records); }
  (photos.during || []).forEach(v => { grab(v.extraoral); grab(v.intraoral); });
  return paths;
}

async function deletePhotoFromStorage(path){
  if(!path) return;
  await ensureFreshSession();
  try{
    await fetch(`${SUPABASE_URL}/storage/v1/object/${PHOTO_STORAGE_BUCKET}/${path}`, { method: 'DELETE', headers: supabaseHeaders() });
  }catch(e){ console.error('delete photo failed', e); }
}

function photoSlotPath(patientId, section, visitId, category, slotId){
  const base = visitId ? `${patientId}/during/${visitId}` : `${patientId}/${section}`;
  return `${base}/${category}-${slotId}-${uid()}.jpg`;
}

function getSlotsObj(section, visitId, category){
  const photos = ensurePhotos(state.currentPatientFile);
  if(section === 'before') return photos.before[category];
  if(section === 'after') return photos.after[category];
  const v = photos.during.find(x=>x.id===visitId);
  return v ? v[category] : null;
}

const PHOTO_SLOT_ORDER = [
  {category:'extraoral', id:'frontalRest'},
  {category:'extraoral', id:'frontalSmile'},
  {category:'extraoral', id:'profile'},
  {category:'intraoral', id:'frontal'},
  {category:'intraoral', id:'occlusalUpper'},
  {category:'intraoral', id:'occlusalLower'},
  {category:'intraoral', id:'right'},
  {category:'intraoral', id:'left'}
];
// "before"/"after" also carry the 3 records/radiograph slots at the end of the batch order
const PHOTO_SLOT_ORDER_WITH_RECORDS = [
  ...PHOTO_SLOT_ORDER,
  {category:'records', id:'occlusalPlan'},
  {category:'records', id:'lateralCeph'},
  {category:'records', id:'panorama'}
];
function photoSlotOrderFor(section){
  return (section === 'before' || section === 'after') ? PHOTO_SLOT_ORDER_WITH_RECORDS : PHOTO_SLOT_ORDER;
}

// does the actual compress+upload+save for one slot, without toasting/rendering —
// used both by single-slot drop and by the batch multi-drop below
async function uploadOnePhotoSlot(section, visitId, category, slotId, file){
  const pFile = state.currentPatientFile;
  const slotsObj = getSlotsObj(section, visitId, category);
  if(!slotsObj) throw new Error('slot not found');
  const blob = await compressImageFile(file);
  const path = photoSlotPath(state.currentPatientId, section, visitId, category, slotId);
  const url = await uploadPhotoToStorage(blob, path);
  const old = slotsObj[slotId];
  slotsObj[slotId] = { path, url, uploadedAt: new Date().toISOString() };
  await savePatientFile(state.currentPatientId, stripHelperFields(pFile));
  if(old && old.path) deletePhotoFromStorage(old.path);
}

async function handlePhotoDrop(section, visitId, category, slotId, file){
  if(!file || !file.type || file.type.indexOf('image/') !== 0){ toast('لازم تختار صورة'); return; }
  toast('بيترفع...');
  try{
    await uploadOnePhotoSlot(section, visitId, category, slotId, file);
    toast('اتضافت الصورة');
    render();
  }catch(e){
    console.error(e);
    toast('فشل رفع الصورة — تأكد إن النت شغال');
  }
}

// drop several photos at once onto the batch zone — fills the empty slots in the fixed
// order (Frontal Rest, Frontal Smile, Profile, Frontal, Occlusal Upper, Occlusal Lower, Right, Left),
// skipping slots that already have a photo so you don't lose good shots while adding missing ones
async function handleBatchPhotoDrop(section, visitId, fileList){
  const files = Array.from(fileList || []).filter(f => f.type && f.type.indexOf('image/') === 0);
  if(!files.length){ toast('محتاج تسحب صور بس'); return; }
  const order = photoSlotOrderFor(section);
  const catsNeeded = [...new Set(order.map(s=>s.category))];
  const objByCat = {};
  for(const c of catsNeeded){
    objByCat[c] = getSlotsObj(section, visitId, c);
    if(!objByCat[c]){ toast('حصل خطأ، حاول تاني'); return; }
  }
  const emptySlots = order.filter(sl => !objByCat[sl.category][sl.id]);
  if(!emptySlots.length){ toast('كل الخانات مليانة بالفعل — امسح خانة الأول لو عايز تستبدلها'); return; }
  const toAssign = files.slice(0, emptySlots.length);

  toast('بيترفع الصور...');
  try{
    for(let i=0;i<toAssign.length;i++){
      await uploadOnePhotoSlot(section, visitId, emptySlots[i].category, emptySlots[i].id, toAssign[i]);
    }
    toast(files.length > emptySlots.length
      ? `اتوزعوا أول ${emptySlots.length} على الخانات الفاضية، والباقي اتجاهل`
      : 'اتوزعوا الصور على الخانات');
    render();
  }catch(e){
    console.error(e);
    toast('فشل رفع بعض الصور — تأكد إن النت شغال وحاول تاني');
    render();
  }
}

// swaps (or moves) two photos between slots — used for fixing a wrong auto-assignment by drag & drop
async function swapPhotoSlots(fromSection, fromVisit, fromCategory, fromSlot, toSection, toVisit, toCategory, toSlot){
  if(fromSection !== toSection || fromVisit !== toVisit){ toast('السحب متاح جوه نفس الزيارة/القسم بس'); return; }
  if(fromCategory === toCategory && fromSlot === toSlot) return;
  const pFile = state.currentPatientFile;
  const fromObj = getSlotsObj(fromSection, fromVisit, fromCategory);
  const toObj = getSlotsObj(toSection, toVisit, toCategory);
  if(!fromObj || !toObj) return;
  const a = fromObj[fromSlot];
  const b = toObj[toSlot];
  if(b) fromObj[fromSlot] = b; else delete fromObj[fromSlot];
  if(a) toObj[toSlot] = a; else delete toObj[toSlot];
  await savePatientFile(state.currentPatientId, stripHelperFields(pFile));
  render();
}

async function deletePhotoSlot(section, visitId, category, slotId){
  if(!(await confirmModal('حذف الصورة دي؟', {danger:true}))) return;
  const pFile = state.currentPatientFile;
  const slotsObj = getSlotsObj(section, visitId, category);
  if(!slotsObj || !slotsObj[slotId]) return;
  const old = slotsObj[slotId];
  delete slotsObj[slotId];
  await savePatientFile(state.currentPatientId, stripHelperFields(pFile));
  deletePhotoFromStorage(old.path);
  await logActivity('delete_photo', `حذف صورة (${section}/${category}/${slotId}) لمريض ${patientNameForLog()}`);
  toast('اتمسحت الصورة');
  render();
}

async function addDuringVisit(){
  const pFile = state.currentPatientFile;
  const photos = ensurePhotos(pFile);
  const dateStr = await promptModal('تاريخ الزيارة', new Date().toISOString().slice(0,10), {type:'date', label:'تاريخ الزيارة'});
  if(!dateStr) return;
  const visit = { id: uid(), date: dateStr, extraoral:{}, intraoral:{} };
  photos.during.push(visit);
  photos.during.sort((a,b) => (a.date < b.date ? -1 : 1));
  await savePatientFile(state.currentPatientId, stripHelperFields(pFile));
  state.photosActiveVisitId = visit.id;
  render();
}

async function deleteDuringVisit(visitId){
  if(!(await confirmModal('حذف الزيارة دي بكل صورها؟', {danger:true}))) return;
  const pFile = state.currentPatientFile;
  const photos = ensurePhotos(pFile);
  const v = photos.during.find(x=>x.id===visitId);
  if(!v) return;
  const allPaths = [...Object.values(v.extraoral||{}), ...Object.values(v.intraoral||{})].map(s=>s.path).filter(Boolean);
  photos.during = photos.during.filter(x=>x.id!==visitId);
  await savePatientFile(state.currentPatientId, stripHelperFields(pFile));
  allPaths.forEach(p => deletePhotoFromStorage(p));
  state.photosActiveVisitId = null;
  toast('اتمسحت الزيارة');
  render();
}

      e.preventDefault();

  });

async function addMaterialUse(entryId){
  const select = document.querySelector(`.material-use-select[data-id="${entryId}"]`);

  const itemId = select.value;

  if(!itemId){ toast('اختار صنف'); return; }
  if(qty <= 0){ toast('اكتب كمية صحيحة'); return; }
  const item = state.inventory.find(i=>i.id === itemId);
  if(!item){ toast('الصنف مش موجود'); return; }

  const file = state.currentPatientFile;
  const e = (file.monthlyLog||[]).find(x=>x.id===entryId);
  if(!e) return;
  if(!e.materialsUsed) e.materialsUsed = [];
  e.materialsUsed.push({ id: uid(), itemId: item.id, itemName: item.name, qty });
