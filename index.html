async function removeMaterialUse(entryId, useId){
  const file = state.currentPatientFile;
  const e = (file.monthlyLog||[]).find(x=>x.id===entryId);
  if(!e) return;
  const use = (e.materialsUsed||[]).find(u=>u.id===useId);
  if(!use) return;
  const isLinkedRebond = !!use.linkedBreakId;
  const msg = isLinkedRebond
    ? 'إلغاء الاستخدام ده هيرجع الكمية للمخزن، ويشيل سجل الكسر المرتبط من خريطة الفصوص، ويمسح رسوم الـ300 جنيه المرتبطة بيه من الحسابات (لو موجودة). متأكد؟'
    : 'إلغاء الاستخدام ده وإرجاع الكمية للمخزن؟';
  if(!(await confirmModal(msg, {danger:true}))) return;

  const item = state.inventory.find(i=>i.id === use.itemId);
  if(item){
    item.qty = (parseFloat(item.qty)||0) + (parseFloat(use.qty)||0);
    await saveInventory();
  }
  e.materialsUsed = (e.materialsUsed||[]).filter(u=>u.id!==useId);

  if(isLinkedRebond){
    const bm = ensureBracketMap(file);
    const t = bm.teeth[use.tooth];
    if(t){
      const idx = t.breaks.findIndex(b=>b.id===use.linkedBreakId);
      if(idx>-1) t.breaks.splice(idx,1);
    }
    if(file.financeExtras) file.financeExtras = file.financeExtras.filter(fx=>fx.id !== use.linkedBreakId);
  }

  await savePatientFile(state.currentPatientId, stripHelperFields(file));
  toast(isLinkedRebond ? 'اترجعت للمخزن واتمسح السجل المرتبط' : 'اترجعت للمخزن');
  render();
}

// ============ KEYWORD-BASED AUTO-DEDUCTION ============
// Palmer notation (quadrant letters + 1-8) <-> FDI (quadrant digit 1-4 + position digit 1-8)
// Clinic convention here is mirrored vs the anatomical default: FDI quadrant 1 (11-18) displays
// as UL, quadrant 2 (21-28) as UR, quadrant 3 (31-38) as LR, quadrant 4 (41-48) as LL.
const PALMER_QUADRANT_TO_FDI = { UR:'2', UL:'1', LL:'4', LR:'3' };
function palmerToFDI(quad, num){
  const q = PALMER_QUADRANT_TO_FDI[quad.toUpperCase()];
  if(!q) return null;
  return q + num;
}
function isValidFDI(tooth){
  return /^[1-4][1-8]$/.test(tooth);
}
// A bare FDI-style digit pair typed by the doctor (e.g. "12") is meant in the same mirrored
// direction as our Palmer convention, not the raw anatomical FDI quadrant — so it needs the
// same quadrant swap Palmer letters already get via palmerToFDI, or it lands on the wrong tooth.
const FDI_QUADRANT_MIRROR = { '1':'2', '2':'1', '3':'4', '4':'3' };
function mirrorFdiQuadrant(fdi){
  const s = String(fdi);
  if(!isValidFDI(s)) return s;
  return FDI_QUADRANT_MIRROR[s[0]] + s[1];
}
// Reverse of palmerToFDI — used everywhere a tooth number is DISPLAYED to the doctor,
// so every table/box shows Palmer (UR7, UL3, LR6...) while all data stays keyed by FDI internally.
const FDI_QUADRANT_TO_PALMER = { '1':'UL', '2':'UR', '3':'LR', '4':'LL' };
function fdiToPalmer(fdi){
  const s = String(fdi);
  if(!isValidFDI(s)) return s;
  return FDI_QUADRANT_TO_PALMER[s[0]] + s[1];
}

function findRevealItemByTooth(tooth, bracketSystem){
  const catId = bracketSystem === 'mbt' ? REVEAL_MBT_CATEGORY_ID : REVEAL_CATEGORY_ID;
  return state.inventory.find(i => i.category === catId && String(i.toothNum) === String(tooth));
}
function findBracketItem(){
  return state.inventory.find(i => i.category === BRACKET_CATEGORY_ID);
}

// finds the bracket sub-item under the main "براكيت" category whose name matches the given type (roth/mbt)
function findBracketItemByType(type){
  const re = type === 'roth' ? /roth/i : /mbt/i;
  return state.inventory.find(i => i.category === BRACKET_CATEGORY_ID && re.test(i.name||''));
}
// ---- Wire size matching ----
// Round sizes: .012 / .014 / .016 / .018 / .020 / .021 ... any 2-3 digit round size.
// Rectangular sizes: .016x.022 / .017x.025 / .018x.025 / .019x.025 / .021x.025 ... written as
// "16*22", "16x22", "0.016x0.022", "17×25" etc. Canonical key: 3-digit padded, e.g. "016" or "016x022".
function padWireDigits(d){
  d = (d||'').replace(/^0+(?=\d)/, '');
  while(d.length < 3) d = '0' + d;
  return d.slice(-3);
}

// Pulls every wire-size-looking token out of a string (item name or log text) and returns
// canonical keys. Unambiguous forms only — decimals and rectangular pairs — safe to scan anywhere.
function extractWireTokensFromText(str){
  const keys = [];
  const rectRe = /0?\.?(\d{2,3})\s*[x×*]\s*0?\.?(\d{2,3})/gi;
  let m;
  const spans = [];
  while((m = rectRe.exec(str))){
    keys.push(padWireDigits(m[1]) + 'x' + padWireDigits(m[2]));
    spans.push([m.index, m.index + m[0].length]);
  }
  let stripped = str;
  spans.reverse().forEach(([s,e])=>{ stripped = stripped.slice(0,s) + ' '.repeat(e-s) + stripped.slice(e); });
  const decRe = /0?\.+(\d{2,3})(?!\d)/g;
  while((m = decRe.exec(stripped))){
    keys.push(padWireDigits(m[1]));
  }
  return keys;
}

// Same as extractWireTokensFromText but also picks up bare shorthand sizes (e.g. "18" with no dot),
// which is safe for an item NAME (already known to live in the wires store) even though it would be
// too ambiguous to allow in freeform log text without a "wire" keyword nearby.
function extractWireTokensFromItemName(name){
  const keys = extractWireTokensFromText(name);
  const stripped = stripWireTokenSpans(name);
  const bareRe = /(?<![.\d])(\d{2,3})(?!\s*[x×*]\s*\d)(?!\.\d)/g;
  let m;
  while((m = bareRe.exec(stripped))){
    keys.push(padWireDigits(m[1]));
  }
  return keys;
}

// Find a non-reveal, non-bracket item whose name matches a given canonical wire-size key
// (e.g. "012" or "016x022"), regardless of "upper"/"lower"/"سلك"/"فوقاني"/"تحتاني" wording,
// dot/asterisk/x notation. For round sizes, `type` ("NITI"/"SS") is used to prefer the item
// whose النوع field matches; falls back to any item of that size if no typed match exists.
// Rectangular sizes ignore `type` entirely (matched by size only, as before).
function findWireItemBySize(key, type){
  const matches = findWireItemsBySize(key);
  if(!matches.length) return null;
  if(type){
    const typed = matches.find(i => (i.type||'').trim().toUpperCase() === type);
    if(typed) return typed;
  }
  return matches[0];
}

// Every wire item (any type) whose name matches the given canonical size key — used to detect
// when a size is ambiguous (matches more than one type, e.g. SS/NITI/TMA all stocked at .012)
// so the user can be asked which one to deduct from.
function findWireItemsBySize(key){
  return state.inventory.filter(i=>{
    if(i.category === REVEAL_CATEGORY_ID || i.category === REVEAL_MBT_CATEGORY_ID || i.category === BRACKET_CATEGORY_ID) return false;
    return extractWireTokensFromItemName(i.name||'').includes(key);
  });
}

const WIRE_KEYWORD_RE = /wire|وير|سلك/i;

// Detects a NITI/SS/TMA mention right next to a round wire size, e.g. "0.012 niti", "0.016ss", "نيتي", "0.017 tma".
function detectWireType(str){
  if(/niti|نيتي/i.test(str)) return 'NITI';
  if(/\bss\b|استانلس|ستانلس/i.test(str)) return 'SS';
  if(/\btma\b|تي\s*ام\s*ايه|تى\s*ام\s*ايه/i.test(str)) return 'TMA';
  return null;
}

// Blanks out (same-length) any decimal or rectangular wire-size matches, so a leftover pass
// scanning for bare shorthand numbers can't re-pick up part of an already-matched size
// (e.g. the "22" inside "16*22").
function stripWireTokenSpans(str){
  const spans = [];
  const rectRe = /0?\.?(\d{2,3})\s*[x×*]\s*0?\.?(\d{2,3})/gi;
  let m;
  while((m = rectRe.exec(str))) spans.push([m.index, m.index + m[0].length]);
  const decRe = /0?\.+(\d{2,3})(?!\d)/g;
  while((m = decRe.exec(str))) spans.push([m.index, m.index + m[0].length]);
  let out = str;
  spans.sort((a,b)=>b[0]-a[0]).forEach(([s,e])=>{ out = out.slice(0,s) + ' '.repeat(e-s) + out.slice(e); });
  return out;
}

// Returns every wire mention in freeform log text as {key, type, rect}:
// - Rectangular ("16*22", "0.017x0.025") — matched by size only, type is always null (unchanged behavior).
// - Round, decimal form ("0.012", ".012", even a typo like "0..016") — matched anywhere in the text,
//   and if "niti"/"ss" (or نيتي/استانلس) appears right next to it (glued or spaced, before or after),
//   that material is attached so the correct stock item (NITI vs SS) gets deducted.
// - Round, bare shorthand ("12","16","18") — only right after a wire keyword (wire/وير/سلك), same
//   nearby-material detection applies.
function extractWireMentions(text){
  const results = [];
  const seen = new Set();

  // 1) rectangular — size-only, exactly as before
  const rectRe = /0?\.?(\d{2,3})\s*[x×*]\s*0?\.?(\d{2,3})/gi;
  let m;
  const rectSpans = [];
  while((m = rectRe.exec(text))){
    const key = padWireDigits(m[1]) + 'x' + padWireDigits(m[2]);
    rectSpans.push([m.index, m.index + m[0].length]);
    const dedupKey = 'rect:' + key;
    if(!seen.has(dedupKey)){ seen.add(dedupKey); results.push({key, type:null, rect:true}); }
  }
  let stripped = text;
  rectSpans.slice().reverse().forEach(([s,e])=>{ stripped = stripped.slice(0,s) + ' '.repeat(e-s) + stripped.slice(e); });

  // 2) round, decimal form — anywhere in the text, tolerant of a stray extra dot ("0..016")
  const decRe = /0?\.+(\d{2,3})(?!\d)/g;
  while((m = decRe.exec(stripped))){
    const key = padWireDigits(m[1]);
    const before = stripped.slice(Math.max(0, m.index - 12), m.index);
    const after = stripped.slice(m.index + m[0].length, m.index + m[0].length + 12);
    const type = detectWireType(after) || detectWireType(before);
    const dedupKey = 'round:' + key + ':' + (type||'');
    if(!seen.has(dedupKey)){ seen.add(dedupKey); results.push({key, type, rect:false}); }
  }

  // 3) round, bare shorthand — only right after a wire keyword, to avoid clashing with tooth
  // numbers/dates elsewhere in the text
  const strippedBare = stripWireTokenSpans(stripped);
  const kwRe = new RegExp(WIRE_KEYWORD_RE.source, 'gi');
  let km;
  while((km = kwRe.exec(strippedBare))){
    const rest = strippedBare.slice(km.index + km[0].length);
    const nextKw = rest.search(WIRE_KEYWORD_RE);
    let end = nextKw === -1 ? rest.length : nextKw;
    const nl = rest.indexOf('\n');
    if(nl !== -1 && nl < end) end = nl;
    const chunk = rest.slice(0, end);
    const bareRe = /(?<![.\d])(\d{2,3})(?!\s*[x×*]\s*\d)(?!\.\d)/g;
    let bm;
    while((bm = bareRe.exec(chunk))){
      const key = padWireDigits(bm[1]);
      const after = chunk.slice(bm.index + bm[0].length, bm.index + bm[0].length + 12);
      const before = chunk.slice(Math.max(0, bm.index - 12), bm.index);
      const type = detectWireType(after) || detectWireType(before);
      const dedupKey = 'round:' + key + ':' + (type||'');
      if(!seen.has(dedupKey)){ seen.add(dedupKey); results.push({key, type, rect:false}); }
    }
  }

  // 4) round, bare number glued or spaced directly to a niti/ss mention — no "wire" keyword
  // needed here, since the material word itself is the signal (e.g. "12niti", "12 niti", "ss16").
  const strippedBare2 = stripWireTokenSpans(stripped);
  const glueRe = /(\d{2,3})\s*(niti|نيتي|ss|tma)\b|\b(niti|نيتي|ss|tma)\s*(\d{2,3})/gi;
  let gm;
  while((gm = glueRe.exec(strippedBare2))){
    const digits = gm[1] || gm[4];
    const typeWord = gm[2] || gm[3];
    if(!digits) continue;
    const key = padWireDigits(digits);
    const type = detectWireType(typeWord);
    const dedupKey = 'round:' + key + ':' + (type||'');
    if(!seen.has(dedupKey)){ seen.add(dedupKey); results.push({key, type, rect:false}); }
  }

  return results;
}

// Elastics: user doesn't need to type "elastic"/"إيلاستيك" at all — a bare fraction size like
// "5/16", "5\16", "3/16", "1/4" anywhere in the text is enough on its own to be recognized.
function extractElasticMentions(text){
  const results = [];
  const seen = new Set();
  const re = /(\d{1,2})\s*[\/\\]\s*(\d{1,2})/g;
  let m;
  while((m = re.exec(text))){
    const key = m[1] + '/' + m[2];
    if(!seen.has(key)){ seen.add(key); results.push(key); }
  }
  return results;
}
function findElasticItemBySize(size){
  return state.inventory.find(i=>{
    if(i.category !== 'elastics') return false;
    const n = (i.name||'').replace(/\\/g,'/').replace(/\s+/g,'');
    return n.includes(size.replace(/\s+/g,''));
  });
}

function extractToothMentions(text){
  // returns FDI tooth numbers mentioned near a rebonding/فص keyword, in either FDI (e.g. "11") or Palmer (e.g. "LL2") form.
  // Supports multiple teeth in one mention, e.g. "rebonding (25,13,LL6,UR3)" or "rebonding 25,13,ll6 و ur3".
  const teeth = new Set();
  const KEYWORD_RE = /rebonding|rebond|rbond|ريبوندنج|ريبوندينج|فص/i;
  const kwRe = new RegExp(KEYWORD_RE.source, 'gi');
  let km;
  while((km = kwRe.exec(text))){
    const rest = text.slice(km.index + km[0].length);
    const nextKw = rest.search(KEYWORD_RE);
    let end = nextKw === -1 ? rest.length : nextKw;
    const nl = rest.indexOf('\n');
    if(nl !== -1 && nl < end) end = nl;
    const chunk = rest.slice(0, end);
    // split the list on commas, whitespace, parentheses/brackets, slashes, and "و" (Arabic "and")
    const tokens = chunk.split(/[,،؛\s()\/؛و]+/).map(t=>t.trim()).filter(Boolean);
    tokens.forEach(token=>{
      const palmerMatch = token.match(/^(UR|UL|LR|LL)\s?([1-8])$/i);
      if(palmerMatch){
        const fdi = palmerToFDI(palmerMatch[1], palmerMatch[2]);
        if(fdi && isValidFDI(fdi)) teeth.add(fdi);
        return;
      }
      if(isValidFDI(token)) teeth.add(mirrorFdiQuadrant(token));
    });
  }
  return [...teeth];
}

function hasBracketRothMention(text){
  return /bracket\s*roth|براكيت\s*روث/i.test(text);
}
function hasBracketMbtMention(text){
  return /bracket\s*mbt|براكيت\s*mbt/i.test(text);
}

// Generic name-based matching for any inventory item not already covered by the specialized
// wire/elastic/bracket/reveal matchers above (e.g. Accessories like mini-screw, button, ...).
// Case-insensitive and space-insensitive: "MiniScrew", "mini screw", "MINI SCREW" all match an
// item named "Mini Screw".
const GENERIC_EXCLUDED_CATEGORIES = new Set(['wires', 'elastics', BRACKET_CATEGORY_ID, REVEAL_CATEGORY_ID, REVEAL_MBT_CATEGORY_ID]);
function normalizeForMatch(s){
  return (s||'').toString().toLowerCase().replace(/\s+/g,'');
}
function extractGenericItemMentions(text){
  const norm = normalizeForMatch(text);
  if(!norm) return [];
  return state.inventory.filter(i=>{
    if(GENERIC_EXCLUDED_CATEGORIES.has(i.category)) return false;
    const name = normalizeForMatch(i.name);
    if(!name) return false;
    return norm.includes(name);
  });
}

// Shows a modal with one button per option and resolves with the picked value (or null if
// cancelled / closed). Used when a wire size matches more than one type in stock (e.g. SS/NITI/TMA)
// and we need the user to say which one to deduct from.
function askChoice(title, message, options){
  return new Promise(resolve=>{
    const bg = document.createElement('div');
    bg.className = 'modal-bg';
    bg.innerHTML = `
      <div class="modal">
        <h3>${escapeHtml(title)}</h3>
        <div class="placeholder" style="text-align:right;padding:10px;margin-bottom:14px;">${escapeHtml(message)}</div>
        <div class="modal-actions" style="flex-wrap:wrap;justify-content:flex-start;">
          ${options.map(o=>`<button class="choice-btn" data-value="${escapeHtml(o.value)}">${escapeHtml(o.label)}</button>`).join('')}
        </div>
        <div class="modal-actions">
          <button class="secondary" id="choiceCancelBtn">إلغاء</button>
        </div>
      </div>
    `;
    document.body.appendChild(bg);
    let done = false;
    const finish = (v) => { if(done) return; done = true; bg.remove(); resolve(v); };
    bg.querySelectorAll('.choice-btn').forEach(btn=>{
      btn.onclick = () => finish(btn.dataset.value);
    });
    document.getElementById('choiceCancelBtn').onclick = () => finish(null);
    bg.onclick = (e) => { if(e.target === bg) finish(null); };
  });
}

async function scanAndDeductKeywords(entryId, text){
  const file = state.currentPatientFile;
  const e = (file.monthlyLog||[]).find(x=>x.id===entryId);
  if(!e || !text) return;
  if(!e.materialsUsed) e.materialsUsed = [];
  const matchedKeys = new Set(e.materialsUsed.map(u=>u.matchKey).filter(Boolean));

  const candidates = []; // {matchKey, kind, item, tooth, label}

  // wires — if a size matches more than one type in stock (SS/NITI/TMA) and the text didn't say
  // which one, ask the user to pick; otherwise use the type mentioned in the text (or the only match).
  // Counted PER LINE so the same size mentioned once in the upper row and once in the lower row
  // deducts twice (two real wires), not once — matchKey gets a #1/#2/... suffix per occurrence.
  // A bare (unsuffixed) legacy key from before this fix still counts as occurrence #1, so nothing
  // already recorded gets deducted again.
  {
    const wireLines = text.split('\n');
    const wireBaseCounts = {};
    for(const line of wireLines){
      if(!line.trim()) continue;
      for(const w of extractWireMentions(line)){
        const sizeMatches = findWireItemsBySize(w.key);
        if(!sizeMatches.length) continue;

        let resolvedType = w.type;
        let item = resolvedType ? sizeMatches.find(i => (i.type||'').trim().toUpperCase() === resolvedType) : null;

        if(!item){
          const distinctTypes = [...new Set(sizeMatches.map(i => (i.type||'').trim().toUpperCase()).filter(Boolean))];
          if(sizeMatches.length === 1 || distinctTypes.length <= 1){
            item = sizeMatches[0];
            resolvedType = (item.type||'').trim().toUpperCase() || null;
          } else {
            const sizeLabel = w.rect ? w.key.replace('x', '×') : ('0.' + w.key);
            const picked = await askChoice(
              'تحديد نوع السلك',
              `في أكتر من نوع سلك مقاس ${sizeLabel} في المخزن. تختار تخصم من انهي نوع؟`,
              distinctTypes.map(t => ({ value: t, label: t }))
            );
            if(!picked) continue; // user cancelled this wire — skip it, keep processing the rest of the text
            resolvedType = picked;
            item = sizeMatches.find(i => (i.type||'').trim().toUpperCase() === picked);
          }
        }
        if(!item) continue;

        const baseKey = 'wire:' + w.key + (resolvedType ? ':' + resolvedType : '');
        const count = (wireBaseCounts[baseKey] = (wireBaseCounts[baseKey]||0) + 1);
        const key = baseKey + '#' + count;
        const alreadyRecorded = matchedKeys.has(key) || (count === 1 && matchedKeys.has(baseKey));
        if(alreadyRecorded) continue;
        candidates.push({matchKey:key, kind:'wire', item, label: item.name});
      }
    }
  }

  // elastics (size alone is enough, no "elastic"/"ايلاستيك" word needed) — same per-line, per-occurrence counting as wires
  {
    const elasticLines = text.split('\n');
    const elasticBaseCounts = {};
    for(const line of elasticLines){
      if(!line.trim()) continue;
      extractElasticMentions(line).forEach(size=>{
        const baseKey = 'elastic:' + size;
        const count = (elasticBaseCounts[baseKey] = (elasticBaseCounts[baseKey]||0) + 1);
        const key = baseKey + '#' + count;
        const alreadyRecorded = matchedKeys.has(key) || (count === 1 && matchedKeys.has(baseKey));
        if(alreadyRecorded) return;
        const item = findElasticItemBySize(size);
        if(item) candidates.push({matchKey:key, kind:'elastic', item, label: item.name});
      });
    }
  }

  // any other named inventory item (accessories, otie, etc.) — matched by name, case/space-insensitive,
  // same per-line, per-occurrence counting so mentioning the same accessory once per arch deducts twice
  {
    const itemLines = text.split('\n');
    const itemBaseCounts = {};
    for(const line of itemLines){
      if(!line.trim()) continue;
      extractGenericItemMentions(line).forEach(item=>{
        const baseKey = 'item:' + item.id;
        const count = (itemBaseCounts[baseKey] = (itemBaseCounts[baseKey]||0) + 1);
        const key = baseKey + '#' + count;
        const alreadyRecorded = matchedKeys.has(key) || (count === 1 && matchedKeys.has(baseKey));
        if(alreadyRecorded) return;
        candidates.push({matchKey:key, kind:'item', item, label: item.name});
      });
    }
  }

  // bracket roth / bracket mbt (deducts from the main "براكيت" category, NOT from the reveal/refill stock)
  // — blocked if it doesn't match the bracket system registered for this patient, or if none is set yet
  if(hasBracketRothMention(text)){
    if(!file.bracketSystem){
      await alertModal('نوع البراكيت للعيان ده لسه مش محدد — حدده الأول (ROTH ولا MBT) من فوق اسم المريض، وبعدين اكتب النص تاني عشان الخصم يبقى صح.');
    } else if(file.bracketSystem !== 'roth'){
      await alertModal(`لأ، العيان ده متسجل بنوع براكيت ${bracketSystemLabel(file.bracketSystem)} مش ROTH. لو النوع غلط، غيّره الأول من فوق اسم المريض وبعدين اكتب النص تاني.`);
    } else {
      const key = 'bracket:roth';
      if(!matchedKeys.has(key)){
        const item = findBracketItemByType('roth');
        if(item) candidates.push({matchKey:key, kind:'bracket', item, label: item.name});
      }
    }
  }
  if(hasBracketMbtMention(text)){
    if(!file.bracketSystem){
      await alertModal('نوع البراكيت للعيان ده لسه مش محدد — حدده الأول (ROTH ولا MBT) من فوق اسم المريض، وبعدين اكتب النص تاني عشان الخصم يبقى صح.');
    } else if(file.bracketSystem !== 'mbt'){
      await alertModal(`لأ، العيان ده متسجل بنوع براكيت ${bracketSystemLabel(file.bracketSystem)} مش MBT. لو النوع غلط، غيّره الأول من فوق اسم المريض وبعدين اكتب النص تاني.`);
    } else {
      const key = 'bracket:mbt';
      if(!matchedKeys.has(key)){
        const item = findBracketItemByType('mbt');
        if(item) candidates.push({matchKey:key, kind:'bracket', item, label: item.name});
      }
    }
  }


  // rebonding / فص (tooth-linked, also triggers a break log entry on that tooth) —
  // deducts from whichever reveal stock (ROTH/MBT) matches the patient's registered bracket system
  let rebondBlockedNoBracketSystem = false;
  extractToothMentions(text).forEach(tooth=>{
    const key = 'rebond:' + tooth;
    if(matchedKeys.has(key)) return;
    if(!file.bracketSystem){ rebondBlockedNoBracketSystem = true; return; }
    const item = findRevealItemByTooth(tooth, file.bracketSystem);
    if(item) candidates.push({matchKey:key, kind:'rebond', item, tooth, label: `${item.name} (سن ${fdiToPalmer(tooth)}) — ${bracketSystemLabel(file.bracketSystem)}`});
  });

  if(rebondBlockedNoBracketSystem){
    await alertModal('في سن اتكتب معاه rebonding/فص بس نوع البراكيت للمريض ده لسه مش محدد (ROTH ولا MBT) — حدده الأول من فوق اسم المريض عشان الخصم يبقى من المخزن الصح، وبعدين اكتب النص تاني.');
  }

  if(!candidates.length) return;

  const msg = 'هيتخصم من المخزن تلقائي:\n' + candidates.map(c=>'- ' + c.label).join('\n') + '\n\nموافق؟';
  if(!(await confirmModal(msg))) return;

  const bm = ensureBracketMap(file);
  const stockAlerts = [];

  candidates.forEach(c=>{
    c.item.qty = Math.max(0, (parseFloat(c.item.qty)||0) - 1);
    const matUse = { id: uid(), itemId: c.item.id, itemName: c.item.name, qty: 1, matchKey: c.matchKey, source:'keyword' };
    if(isLowStockItem(c.item)) stockAlerts.push(c.item.name);

    if(c.kind === 'rebond'){
      const t = bm.teeth[c.tooth];
      if(t){
        const isFirstBreak = t.breaks.length === 0;
        const charged = !isFirstBreak;
        const breakId = uid();
        const today = e.date || new Date().toISOString().slice(0,10);
        t.breaks.push({ id: breakId, date: today, charged });
        t.status = 'broken';
        // link this materials-used entry to the break record it created, so undoing either one
        // (from Monthly Follow-up or from Bracket Map) cleans up the other + the finance charge
        matUse.tooth = c.tooth;
        matUse.linkedBreakId = breakId;
        if(charged){
          if(!file.financeExtras) file.financeExtras = [];
          file.financeExtras.push({ id: breakId, amount: 300, reason: `ريبوندنج فص - سن ${fdiToPalmer(c.tooth)}`, date: today });
        }
      }
    }
    e.materialsUsed.push(matUse);
  });

  await saveInventory();
  await savePatientFile(state.currentPatientId, stripHelperFields(file));
  toast(stockAlerts.length ? `اتخصم من المخزن — ⚠ ${stockAlerts.join('، ')} وصل لحد الإنذار` : 'اتخصم من المخزن');
  render();
}

// ============ HYGIENE TAB ============
const HYGIENE_LABELS = {excellent:'ممتازة', good:'جيدة', fair:'متوسطة', poor:'ضعيفة'};
const HYGIENE_CLASS = {excellent:'hyg-excellent', good:'hyg-good', fair:'hyg-fair', poor:'hyg-poor'};

function renderHygieneTab(){
  const file = state.currentPatientFile;
  const log = file.monthlyLog || [];
  const rated = log.filter(e=>e.hygieneRating).sort((a,b)=>(b.date||'').localeCompare(a.date||''));
  const lastTwo = rated.slice(0,2);
  const concerning = lastTwo.length === 2 && lastTwo.every(e => e.hygieneRating==='poor' || e.hygieneRating==='fair');

  const rows = rated.map(e => `
    <div class="hygiene-row">
      <span class="hygiene-date">${escapeHtml(e.date||'')}</span>
      <span class="hygiene-chip ${HYGIENE_CLASS[e.hygieneRating]}">${HYGIENE_LABELS[e.hygieneRating]}</span>
    </div>
  `).join('');

  return `
    <div class="section-title">نظافة الأسنان</div>
    <div class="placeholder" style="text-align:right;padding:10px;margin-bottom:14px;">التقييم بيتسجل من تبويب المتابعة الشهرية لكل شهر</div>
    ${concerning ? `<div class="bracket-alert">⚠ آخر تقييمين لنظافة الأسنان متوسطة/ضعيفة — يستحق التنبيه على المريض</div>` : ''}
    <div class="hygiene-list">
      ${rows || '<div class="placeholder">لسه مفيش تقييم نظافة مسجل</div>'}
    </div>
  `;
}

// ============ TREATMENT STAGES TAB ============
function computeStageCounts(file){
  const counts = {};
  TREATMENT_STAGES.forEach(st => counts[st.id] = []);
  (file.monthlyLog||[]).forEach(e=>{
    (e.stages||[]).forEach(sid=>{
      if(counts[sid]) counts[sid].push(e);
    });
  });
  return counts;
}

function renderStagesTab(){
  const file = state.currentPatientFile;
  const counts = computeStageCounts(file);
  const ALERT_THRESHOLD = 4;

  const cards = TREATMENT_STAGES.map(st=>{
    const entries = [...(counts[st.id]||[])].sort((a,b)=>(b.date||'').localeCompare(a.date||''));
    const n = entries.length;
    let dragging, draggingMsg;
    if(st.id === MIDLINE_STAGE_ID){
      const dated = entries.map(e=>e.date).filter(Boolean).sort();
      const firstDate = dated[0];
      if(firstDate){
        const months = monthsSince(firstDate);
        dragging = n>0 && months >= MIDLINE_ALERT_MONTHS;
        draggingMsg = `⚠ المرحلة دي مستمرة من ${months} شهر تقريبًا — تستحق مراجعة الخطة`;
      } else {
        dragging = false;
      }
    } else {
      dragging = n >= ALERT_THRESHOLD;
      draggingMsg = `⚠ المرحلة دي طالت (${n} مرات) — تستحق مراجعة الخطة`;
    }
    const chips = entries.map(e => `
      <span class="stage-date-chip">
        <input type="date" class="stage-date-input" data-entry="${e.id}" value="${escapeHtml(e.date||'')}">
        <button class="stage-date-remove" data-entry="${e.id}" data-stage="${st.id}" title="إلغاء تسجيل المرحلة دي">×</button>
      </span>
    `).join('');
    return `
      <div class="stage-card ${dragging?'dragging':''}">
        <div class="stage-card-head">
          <div class="stage-name">${st.label}</div>
          <div class="stage-count">${n}</div>
        </div>
        ${dragging ? `<div class="bracket-alert" style="margin:8px 0 0;">${draggingMsg}</div>` : ''}
        ${n ? `<div class="stage-dates">${chips}</div>` : `<div class="placeholder" style="margin-top:8px;">لسه مفيش تسجيل للمرحلة دي</div>`}
        <div class="row" style="margin-top:10px;">
          <button class="secondary small stage-add-btn" data-stage="${st.id}">+ إضافة تسجيل (وعدّل تاريخه)</button>
        </div>
      </div>
    `;
  }).join('');

  return `
    <div class="section-title">مراحل العلاج</div>
    <div class="placeholder" style="text-align:right;padding:10px;margin-bottom:14px;">العداد بيتحدث تلقائيًا من تسجيلات المتابعة الشهرية — ممكن كمان تعدّل تاريخ أي تسجيل هنا مباشرة أو تضيف تسجيل قديم/جديد</div>
    <div class="stage-grid">${cards}</div>
  `;
}

// ============ BRACKET MAP TAB ============
const FDI_TEETH_ROWS = {
  upper: ['18','17','16','15','14','13','12','11','21','22','23','24','25','26','27','28'],
  lower: ['48','47','46','45','44','43','42','41','31','32','33','34','35','36','37','38']
};

function ensureBracketMap(file){
  if(!file.bracketMap) file.bracketMap = { teeth: {} };
  if(!file.bracketMap.teeth) file.bracketMap.teeth = {};
  [...FDI_TEETH_ROWS.upper, ...FDI_TEETH_ROWS.lower].forEach(t=>{
    if(!file.bracketMap.teeth[t]) file.bracketMap.teeth[t] = { status:'green', breaks: [] };
  });
  return file.bracketMap;
}

function renderToothBox(num, data){
  const broken = data.status === 'broken';
  const count = data.breaks.length;
  const repeat = count >= 2;
  return `
    <div class="tooth ${broken?'broken':''} ${repeat?'repeat':''}" data-tooth="${num}" title="${broken?'مكسور':'سليم'} — عدد مرات الكسر: ${count}">
      ${count>0 ? `<span class="badge">${count}</span>` : ''}
      ${fdiToPalmer(num)}
    </div>
  `;
}

function renderBracketsTab(){
  const file = state.currentPatientFile;
  const bm = ensureBracketMap(file);
  const teeth = bm.teeth;
  const allNums = [...FDI_TEETH_ROWS.upper, ...FDI_TEETH_ROWS.lower];
  const brokenNow = allNums.filter(n=>teeth[n].status==='broken').length;
  const totalBreaks = allNums.reduce((s,n)=>s+teeth[n].breaks.length,0);
  const repeatTeeth = allNums.filter(n=>teeth[n].breaks.length>=2);

  const upperRow = FDI_TEETH_ROWS.upper.map((n,i)=> (i===8?'<div class="quad-gap"></div>':'') + renderToothBox(n, teeth[n])).join('');
  const lowerRow = FDI_TEETH_ROWS.lower.map((n,i)=> (i===8?'<div class="quad-gap"></div>':'') + renderToothBox(n, teeth[n])).join('');

  let logRows = [];
  allNums.forEach(n=>{
    teeth[n].breaks.forEach(b=>{ logRows.push({tooth:n, ...b}); });
  });
  logRows.sort((a,b)=> (b.date||'').localeCompare(a.date||''));

  const logHtml = logRows.length ? `
    <table>
      <thead><tr><th>التاريخ</th><th>السن</th><th>الرسوم</th><th></th></tr></thead>
      <tbody>
        ${logRows.map(r=>`
          <tr>
            <td>${escapeHtml(r.date||'')}</td>
            <td>${fdiToPalmer(r.tooth)}</td>
            <td class="${r.charged?'charge-yes':'charge-no'}">${r.charged? '300 جنيه' : '—'}</td>
            <td><button class="danger small" data-del-break="${r.id}" data-tooth="${r.tooth}">حذف</button></td>
          </tr>
        `).join('')}
      </tbody>
    </table>
  ` : `<div class="placeholder" style="margin-top:10px;">لسه مفيش كسور مسجلة</div>`;

  return `
    <div class="bracket-summary">
      <div class="bracket-stat"><div class="num">${brokenNow}</div><div class="lbl">مكسور حاليًا</div></div>
      <div class="bracket-stat"><div class="num">${totalBreaks}</div><div class="lbl">إجمالي مرات الكسر</div></div>
      <div class="bracket-stat"><div class="num">${repeatTeeth.length}</div><div class="lbl">أسنان بتتكسر بتكرار</div></div>
    </div>
    ${repeatTeeth.length ? `<div class="bracket-alert">⚠ تنبيه: السن رقم ${repeatTeeth.join('، ')} بيتكسر بشكل متكرر</div>` : ''}
    <div class="tooth-arch">
      <div class="arch-label">الفك العلوي (Upper)</div>
      <div class="tooth-row">${upperRow}</div>
    </div>
    <div class="tooth-arch">
      <div class="arch-label">الفك السفلي (Lower)</div>
      <div class="tooth-row">${lowerRow}</div>
    </div>
    <div class="placeholder" style="text-align:right;padding:10px;">دوس على السن عشان تسجل كسر، ودوس تاني عشان تسجله سليم بعد الإصلاح</div>
    <div class="break-log">
      <div class="section-title" style="font-size:13px;">سجل الكسور</div>
      ${logHtml}
    </div>
  `;
}

async function toggleTooth(num){
  const file = state.currentPatientFile;
  const bm = ensureBracketMap(file);
  const t = bm.teeth[num];
  if(t.status === 'green'){
    const isFirstBreak = t.breaks.length === 0;
    const charged = !isFirstBreak;
    const breakId = uid();
    const today = new Date().toISOString().slice(0,10);
    t.breaks.push({ id: breakId, date: today, charged });
    t.status = 'broken';
    if(charged){
      if(!file.financeExtras) file.financeExtras = [];
      file.financeExtras.push({ id: breakId, amount: 300, reason: `كسر بريكت متكرر - سن ${fdiToPalmer(num)}`, date: today });
    }
    await savePatientFile(state.currentPatientId, stripHelperFields(file));
    toast(charged ? `اتسجل كسر السن ${fdiToPalmer(num)} + 300 جنيه` : `اتسجل كسر السن ${fdiToPalmer(num)}`);
  } else {
    if(!(await confirmModal(`تأكيد إن السن ${fdiToPalmer(num)} اتصلح؟`))) return;
    t.status = 'green';
    await savePatientFile(state.currentPatientId, stripHelperFields(file));
    toast(`السن ${fdiToPalmer(num)} رجع سليم`);
  }
  render();
}

async function deleteBreakEntry(tooth, breakId){
  if(!(await confirmModal('حذف سجل الكسر ده؟ ده هيشيل معاه أي رسوم مرتبطة في الحسابات، ولو الكسر ده كان جاي من "rebonding" في المتابعة الشهرية هيرجع الكمية المخصومة للمخزن تلقائي.', {danger:true}))) return;
  const file = state.currentPatientFile;
  const bm = ensureBracketMap(file);
  const t = bm.teeth[tooth];
  const idx = t.breaks.findIndex(b=>b.id===breakId);
  if(idx>-1) t.breaks.splice(idx,1);
  if(file.financeExtras) file.financeExtras = file.financeExtras.filter(e=>e.id !== breakId);

  // if this break was created via a "rebonding" keyword match in Monthly Follow-up, undo that side too:
  // restore the stock it deducted and remove the tag from that entry's materials-used list
  let inventoryChanged = false;
  (file.monthlyLog||[]).forEach(entry=>{
    if(!entry.materialsUsed) return;
    const linked = entry.materialsUsed.find(u=>u.linkedBreakId === breakId);
    if(linked){
      const item = state.inventory.find(i=>i.id === linked.itemId);
      if(item){ item.qty = (parseFloat(item.qty)||0) + (parseFloat(linked.qty)||0); inventoryChanged = true; }
      entry.materialsUsed = entry.materialsUsed.filter(u=>u.linkedBreakId !== breakId);
    }
  });
  if(inventoryChanged) await saveInventory();

  await savePatientFile(state.currentPatientId, stripHelperFields(file));
  toast('اتحذف السجل');
  render();
}

function attachBracketsHandlers(){
  document.querySelectorAll('.tooth').forEach(el=>{
    el.onclick = () => toggleTooth(el.dataset.tooth);
  });
  document.querySelectorAll('[data-del-break]').forEach(el=>{
    el.onclick = (e) => { e.stopPropagation(); deleteBreakEntry(el.dataset.tooth, el.dataset.delBreak); };
  });
}

function renderDiagnosisTab(){
  const file = state.currentPatientFile;
  const sections = file.diagnosisSections || [];
  const problemListIndex = sections.findIndex(s => s.title.trim().toLowerCase() === 'problem list and mechanics');

  function buildAccordion(s, idx){
    const groups = s.groups || [];
    const fields = s.fields || [];
    const isOpen = state.expandedDiagSections[s.id] !== false; // default open

    const showFlag = problemListIndex === -1 ? true : idx < problemListIndex;
    const isProblemSection = s.title.trim().toLowerCase() === 'problem list and mechanics';

    const groupRows = groups.map(g => `
      <tr class="diag-group-row">
        <td colspan="2"><input type="text" class="diag-group-title gname" data-sec="${s.id}" data-group="${g.id}" value="${escapeHtml(g.title)}"></td>
        <td></td>
      </tr>
      ${(g.fields||[]).map(f => renderFieldTableRow(s.id, g.id, f, showFlag, isProblemSection)).join('')}
    `).join('');

    const fieldRows = fields.map(f => renderFieldTableRow(s.id, null, f, showFlag, isProblemSection)).join('');

    const bodyHtml = isOpen ? `
      <div class="diag-acc-body">
        <table class="diag-table">
          <thead><tr><th>${escapeHtml(s.col1 || 'العنصر')}</th><th>${escapeHtml(s.col2 || 'القيمة')}</th><th></th></tr></thead>
          <tbody>
            ${groupRows}
            ${fieldRows}
          </tbody>
        </table>
        <div class="row" style="flex-wrap:wrap;margin-top:10px;">
          <button class="secondary small diag-custom-field" data-sec="${s.id}" data-group="">+ حقل</button>
          <button class="secondary small diag-custom-group" data-sec="${s.id}">+ مجموعة (زي Frontal/Lateral)</button>
          <button class="secondary small diag-rename" data-id="${s.id}">✎ تعديل اسم القسم</button>
          <button class="danger small diag-delete" data-id="${s.id}">حذف القسم</button>
        </div>
        <textarea class="diag-content" data-id="${s.id}" placeholder="ملاحظات عامة..." style="margin-top:10px;">${escapeHtml(s.content||'')}</textarea>
      </div>
    ` : '';

    return `
    <div class="diag-accordion" data-section-id="${s.id}">
      <div class="diag-acc-head ${isOpen?'open':''}" data-toggle="${s.id}">
        <span class="t">${escapeHtml(s.title)}</span>
        <span class="arrow">›</span>
      </div>
      ${bodyHtml}
    </div>
  `;
  }

  let extraHtml = null, introHtml = null;
  const othersHtml = [];
  sections.forEach((s, idx) => {
    const html = buildAccordion(s, idx);
    if(s.title === 'Extra-oral') extraHtml = html;
    else if(s.title === 'Intra-oral') introHtml = html;
    else othersHtml.push(html);
  });

  const topRow = (extraHtml || introHtml) ? `<div class="diag-side-by-side">${extraHtml||''}${introHtml||''}</div>` : '';
  const sectionsHtml = topRow + othersHtml.join('');

  return `
    <div class="section-title">شيت التشخيص وخطة العلاج</div>
    <div class="row" style="margin-bottom:14px;">
      <button class="secondary small" id="customAddBtn">+ قسم إضافي</button>
      <button class="secondary small" id="resetTemplateBtn">إعادة تعيين الشيت الافتراضي</button>
    </div>
    ${sectionsHtml}
  `;
}

function findFieldContext(file, fieldId){
  for(const s of (file.diagnosisSections||[])){
    for(const f of (s.fields||[])){
      if(f.id === fieldId) return {section: s, group: null, field: f};
    }
    for(const g of (s.groups||[])){
      for(const f of (g.fields||[])){
        if(f.id === fieldId) return {section: s, group: g, field: f};
      }
    }
  }
  return null;
}

async function flagToProblemList(fieldId){
  const valueEl = document.querySelector(`.diag-field-value[data-id="${fieldId}"]`);
  const labelEl = document.querySelector(`.diag-field-label[data-id="${fieldId}"]`);
  const value = valueEl ? valueEl.value.trim() : '';
  if(!value){ toast('اكتب القيمة الأول'); return; }
  const file = state.currentPatientFile;
  const ctx = findFieldContext(file, fieldId);
  if(!ctx) return;
  ctx.field.value = value;
  ctx.field.label = labelEl ? labelEl.value : ctx.field.label;
  const label = ctx.group ? `${ctx.group.title} - ${ctx.field.label}` : ctx.field.label;
  let problemSection = file.diagnosisSections.find(s => s.title.trim().toLowerCase() === 'problem list and mechanics');
  if(!problemSection){
    problemSection = { id: uid(), title: 'Problem List and Mechanics', groups: [], fields: [], content: '', col1: 'Problems', col2: 'Mechanics' };
    file.diagnosisSections.push(problemSection);
  }
  if(!problemSection.fields) problemSection.fields = [];
  const emptyRow = problemSection.fields.find(f => !f.label && !f.value);
  const problemText = `${label}: ${value}`;
  if(emptyRow){
    emptyRow.label = problemText;
  } else {
    problemSection.fields.push({ id: uid(), label: problemText, value: '' });
  }
  await savePatientFile(state.currentPatientId, stripHelperFields(file));
  toast('اتضافت في Problem List');
  render();
}

async function flagToTreatmentPlan(fieldId){
  const valueEl = document.querySelector(`.diag-field-value[data-id="${fieldId}"]`);
  const labelEl = document.querySelector(`.diag-field-label[data-id="${fieldId}"]`);
  const value = valueEl ? valueEl.value.trim() : '';
  const label = labelEl ? labelEl.value.trim() : '';
  if(!label && !value){ toast('اكتب المشكلة أو الميكانيزم الأول'); return; }
  const file = state.currentPatientFile;
  const ctx = findFieldContext(file, fieldId);
  if(!ctx) return;
  ctx.field.value = value;
  ctx.field.label = label;
  let tpSection = file.diagnosisSections.find(s => s.title.trim().toLowerCase() === 'treatment plan');
  if(!tpSection){
    tpSection = { id: uid(), title: 'Treatment Plan', groups: [], fields: [], content: '' };
    file.diagnosisSections.push(tpSection);
  }
  if(!tpSection.fields) tpSection.fields = [];
  const planText = value ? `${label}: ${value}` : label;
  const emptyRow = tpSection.fields.find(f => !f.label && !f.value);
  if(emptyRow){
    emptyRow.label = planText;
  } else {
    tpSection.fields.push({ id: uid(), label: planText, value: '' });
  }
  await savePatientFile(state.currentPatientId, stripHelperFields(file));
  toast('اتضافت في Treatment Plan');
  render();
}

async function addDiagnosisSection(title){
  const file = state.currentPatientFile;

  file.diagnosisSections.push({ id: uid(), title, groups: [], fields: [], content: '' });

async function updateDiagnosisSection(id, changes){

  Object.assign(s, changes);
  await savePatientFile(state.currentPatientId, stripHelperFields(file));
  toast('اتحفظ');
}

async function deleteDiagnosisSection(id){

  file.diagnosisSections = (file.diagnosisSections || []).filter(x=>x.id !== id);
  await savePatientFile(state.currentPatientId, stripHelperFields(file));

}

async function updateDiagnosisGroup(secId, groupId, changes){

  const s = (file.diagnosisSections || []).find(x=>x.id === secId);
  if(!s) return;
  const g = (s.groups || []).find(x=>x.id === groupId);

  toast('اتحفظ');

function getFieldsArray(s, groupId){
  if(groupId){
    const g = (s.groups || []).find(x=>x.id === groupId);
    if(!g) return null;
    if(!g.fields) g.fields = [];
    return g.fields;
  }
  if(!s.fields) s.fields = [];
  return s.fields;
}

async function deleteDiagnosisField(secId, groupId, fieldId){

function stripHelperFields(file){

  `;

    const file = state.currentPatientFile;
    const s = (file.diagnosisSections || []).find(x=>x.id === secId);

function escapeHtml(str){

    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;');
}

function renderFinanceTab(){
  const file = state.currentPatientFile;
  const clinic = state.clinics.find(c=>c.id === state.currentClinicId);
  const commissionPct = clinic ? (parseFloat(clinic.commission) || 70) : 70;
  const total = parseFloat(file.financeTotal) || 0;
  const extras = file.financeExtras || [];
  const extrasSum = extras.reduce((s,e)=> s + (parseFloat(e.amount)||0), 0);
  const payments = file.payments || [];
  const paidSum = payments.reduce((s,p)=> s + (parseFloat(p.amount)||0), 0);
  const caseValue = total + extrasSum;
  const remaining = caseValue - paidSum;
  const yourShare = caseValue * (commissionPct/100);
  const clinicShare = caseValue - yourShare;

  const paymentsSorted = [...payments].sort((a,b)=>(b.date||'').localeCompare(a.date||''));
  const extrasSorted = [...extras].sort((a,b)=>(b.date||'').localeCompare(a.date||''));

  const paymentsHtml = paymentsSorted.length ? `
    <div class="finance-tables">
      <table>
        <thead><tr><th>التاريخ</th><th>المبلغ</th><th>ملاحظة</th><th></th></tr></thead>
        <tbody>
          ${paymentsSorted.map(p=>`
            <tr>
              <td>${escapeHtml(p.date||'')}</td>
              <td>${(parseFloat(p.amount)||0).toLocaleString()} جنيه</td>
              <td>${escapeHtml(p.note||'')}</td>
              <td>
                <button class="secondary small" data-edit-payment="${p.id}">تعديل</button>
                <button class="danger small" data-del-payment="${p.id}">حذف</button>
              </td>
            </tr>
          `).join('')}
        </tbody>
      </table>
    </div>
  ` : `<div class="placeholder" style="margin-top:8px;">لسه مفيش دفعات مسجلة</div>`;

  const extrasHtml = extrasSorted.length ? `
    <div class="finance-tables">
      <table>
        <thead><tr><th>التاريخ</th><th>السبب</th><th>المبلغ</th><th></th></tr></thead>
        <tbody>
          ${extrasSorted.map(e=>`
            <tr>
              <td>${escapeHtml(e.date||'')}</td>
              <td>${escapeHtml(e.reason||'')}</td>
              <td>${(parseFloat(e.amount)||0).toLocaleString()} جنيه</td>
              <td>
                <button class="secondary small" data-edit-extra="${e.id}">تعديل</button>
                <button class="danger small" data-del-extra="${e.id}">حذف</button>
              </td>
            </tr>
          `).join('')}
        </tbody>
      </table>
    </div>
  ` : `<div class="placeholder" style="margin-top:8px;">لا يوجد رسوم إضافية</div>`;

  const AR_MONTHS = ['يناير','فبراير','مارس','أبريل','مايو','يونيو','يوليو','أغسطس','سبتمبر','أكتوبر','نوفمبر','ديسمبر'];
  function monthLabelAr(ym){
    const [y,m] = ym.split('-');
    const idx = parseInt(m,10) - 1;
    return (AR_MONTHS[idx] || m) + ' ' + y;
  }
  const monthlyMap = {};
  payments.forEach(p=>{
    const ym = (p.date||'').slice(0,7);
    if(!ym) return;
    monthlyMap[ym] = (monthlyMap[ym]||0) + (parseFloat(p.amount)||0);
  });
  const months = Object.keys(monthlyMap).sort((a,b)=>b.localeCompare(a));
  const monthlyCommissionHtml = months.length ? `
    <div class="finance-tables">
      <table>
        <thead><tr><th>الشهر</th><th>المدفوع</th><th>نصيبك (${commissionPct}%)</th><th>نصيب العيادة</th></tr></thead>
        <tbody>
          ${months.map(ym=>{
            const amt = monthlyMap[ym];
            const yShare = amt * (commissionPct/100);
            const cShare = amt - yShare;
            return `<tr><td>${monthLabelAr(ym)}</td><td>${amt.toLocaleString()} جنيه</td><td>${yShare.toLocaleString()} جنيه</td><td>${cShare.toLocaleString()} جنيه</td></tr>`;
          }).join('')}
        </tbody>
      </table>
    </div>
  ` : `<div class="placeholder" style="margin-top:8px;">لسه مفيش دفعات مسجلة بتاريخ عشان نحسب التوزيع الشهري</div>`;

  return `
    <div class="section-title">الحسابات</div>
    <div class="field" style="max-width:240px;">
      <label>التوتال المتفق عليه (بدون الإضافات)</label>
      <input type="number" id="financeTotalInput" value="${total}">
    </div>
    <div class="bracket-summary" style="margin-top:14px;">
      <div class="bracket-stat"><div class="num">${caseValue.toLocaleString()}</div><div class="lbl">إجمالي قيمة الحالة</div></div>
      <div class="bracket-stat"><div class="num">${paidSum.toLocaleString()}</div><div class="lbl">المدفوع</div></div>
      <div class="bracket-stat"><div class="num">${remaining.toLocaleString()}</div><div class="lbl">المتبقي</div></div>
    </div>
    <div class="bracket-summary">
      <div class="bracket-stat"><div class="num">${yourShare.toLocaleString()}</div><div class="lbl">نصيبك (${commissionPct}%)</div></div>
      <div class="bracket-stat"><div class="num">${clinicShare.toLocaleString()}</div><div class="lbl">نصيب العيادة</div></div>
    </div>

    <div class="section-title" style="font-size:13px;margin-top:18px;">الدفعات</div>
    <div class="row" style="margin-bottom:10px;">
      <button class="secondary small" id="addPaymentBtn">+ تسجيل دفعة</button>
    </div>
    ${paymentsHtml}

    <div class="section-title" style="font-size:13px;margin-top:18px;">توزيع العمولة شهريًا (حسب المدفوع)</div>
    ${monthlyCommissionHtml}

    <div class="section-title" style="font-size:13px;margin-top:18px;">رسوم إضافية</div>
    <div class="row" style="margin-bottom:10px;">
      <button class="secondary small" id="addExtraBtn">+ إضافة رسوم</button>
    </div>
    ${extrasHtml}
  `;
}

async function deleteFinanceExtra(id){
  const file = state.currentPatientFile;
  const isBreakCharge = (file.financeExtras||[]).some(e=>e.id===id) && (function(){
    const bm = ensureBracketMap(file);
    return Object.values(bm.teeth).some(t=>t.breaks.some(b=>b.id===id));
  })();
  const msg = isBreakCharge
    ? 'حذف الرسوم دي هيشيل معاها سجل الكسر المرتبط من خريطة الفصوص، ولو كان جاي من "rebonding" في المتابعة الشهرية هيرجع الكمية المخصومة للمخزن تلقائي. متأكد؟'
    : 'حذف الرسوم دي؟';
  if(!(await confirmModal(msg, {danger:true}))) return;

  file.financeExtras = (file.financeExtras||[]).filter(e=>e.id !== id);

  if(isBreakCharge){
    const bm = ensureBracketMap(file);
    Object.values(bm.teeth).forEach(t=>{
      const idx = t.breaks.findIndex(b=>b.id===id);
      if(idx>-1) t.breaks.splice(idx,1);
    });
    let inventoryChanged = false;
    (file.monthlyLog||[]).forEach(entry=>{
      if(!entry.materialsUsed) return;
      const linked = entry.materialsUsed.find(u=>u.linkedBreakId === id);
      if(linked){
        const item = state.inventory.find(i=>i.id === linked.itemId);
        if(item){ item.qty = (parseFloat(item.qty)||0) + (parseFloat(linked.qty)||0); inventoryChanged = true; }
        entry.materialsUsed = entry.materialsUsed.filter(u=>u.linkedBreakId !== id);
      }
    });
    if(inventoryChanged) await saveInventory();
  }

  await savePatientFile(state.currentPatientId, stripHelperFields(file));
  render();
}

  const totalInput = document.getElementById('financeTotalInput');

  if(addPaymentBtn) addPaymentBtn.onclick = () => openAddPaymentModal();

  document.querySelectorAll('[data-del-payment]').forEach(el=>{
    el.onclick = () => deletePayment(el.dataset.delPayment);
  });
  document.querySelectorAll('[data-edit-payment]').forEach(el=>{

  });
  document.querySelectorAll('[data-del-extra]').forEach(el=>{
    el.onclick = () => deleteFinanceExtra(el.dataset.delExtra);
  });
  document.querySelectorAll('[data-edit-extra]').forEach(el=>{
    el.onclick = () => openEditExtraModal(el.dataset.editExtra);
  });
}

// ============ INIT (login gate first) ============
function renderLoginScreen(errorMsg){
  document.getElementById('app').innerHTML = `
    <div style="max-width:340px;margin:70px auto;padding:26px;background:var(--panel);border:1px solid var(--border);border-radius:14px;">
      <h2 style="text-align:center;margin:0 0 18px;">تسجيل الدخول</h2>
      ${errorMsg ? `<div style="color:var(--red);font-size:13px;margin-bottom:12px;text-align:center;">${escapeHtml(errorMsg)}</div>` : ''}
      <div class="field"><label>الإيميل</label><input type="email" id="loginEmail" autocomplete="username"></div>
      <div class="field" style="margin-top:10px;"><label>الباسورد</label><input type="password" id="loginPassword" autocomplete="current-password"></div>
      <button id="loginBtn" style="width:100%;margin-top:18px;">دخول</button>
    </div>
  `;
  const emailEl = document.getElementById('loginEmail');
  const passEl = document.getElementById('loginPassword');
  const btn = document.getElementById('loginBtn');
  const doLogin = async () => {
    const email = emailEl.value.trim();
    const password = passEl.value;
    if(!email || !password){ renderLoginScreen('اكتب الإيميل والباسورد'); return; }
    btn.disabled = true;
    btn.textContent = 'بيدخل...';
    try{
      await supabaseLogin(email, password);
      await boot();
    }catch(e){
      renderLoginScreen(e.message || 'فشل تسجيل الدخول');
    }
  };
  btn.onclick = doLogin;
  passEl.onkeydown = (e) => { if(e.key === 'Enter') doLogin(); };
}

async function boot(){
  try{
    authSession = loadStoredSession();
    const ok = authSession ? await ensureFreshSession() : false;
    if(!ok){
      renderLoginScreen();
      return;
    }
    await loadClinics();
    render();
    attachGlobalLogoutButton();
  }catch(err){
    renderFatalErrorScreen(err);
  }
}

function attachGlobalLogoutButton(){
  if(document.getElementById('globalLogoutBtn')) return;
  const btn = document.createElement('button');
  btn.id = 'globalLogoutBtn';
  btn.textContent = 'خروج';
  btn.className = 'secondary small';
  btn.style.cssText = 'position:fixed;top:10px;left:10px;z-index:999;';
  btn.onclick = async () => { if(await confirmModal('تسجيل الخروج؟')) supabaseLogout(); };
  document.body.appendChild(btn);

  const logBtn = document.createElement('button');
  logBtn.id = 'globalActivityLogBtn';
  logBtn.textContent = 'سجل العمليات';
  logBtn.className = 'secondary small';
  logBtn.style.cssText = 'position:fixed;top:10px;left:70px;z-index:999;';
  logBtn.onclick = () => openActivityLogModal();
  document.body.appendChild(logBtn);
}

boot();
</script>
